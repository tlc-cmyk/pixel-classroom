<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1008">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>像素課室 · 中四 ICT · Lap Cheung Tsao</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100svh;
    height: 100dvh;
    background: #0e0906;
    overflow: hidden;
    font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", "Courier New", monospace;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100svh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    background: #120c08;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
    background: #120c08;
    cursor: crosshair;
  }
  /* D-pad — bottom-left, thumb zone */
  #dpad {
    display: none;
    position: absolute;
    left: max(10px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 176px;
    height: 176px;
    z-index: 8;
    user-select: none;
    touch-action: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55));
  }
  #dpad.show { display: block; }
  #dpad .btn {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(70,46,28,0.92), rgba(40,26,16,0.92));
    border: 3px solid #d4a86a;
    box-shadow: inset 0 1px 0 rgba(255,240,200,0.25), inset 0 -2px 0 rgba(0,0,0,0.35);
    color: #fff8ee;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  #dpad .btn.active {
    background: linear-gradient(180deg, rgba(240,193,75,0.75), rgba(180,120,40,0.85));
    border-color: #ffe08a;
    transform: scale(0.96);
  }
  #dpad .up { left: 60px; top: 0; }
  #dpad .down { left: 60px; bottom: 0; }
  #dpad .left { left: 0; top: 60px; }
  #dpad .right { right: 0; top: 60px; }
  #dpad .center {
    left: 60px; top: 60px; width: 56px; height: 56px;
    border-radius: 50%; opacity: 0.4; pointer-events: none;
    font-size: 12px; border-style: dashed;
  }
  /* Action cluster — bottom-right */
  #actions {
    display: none;
    position: absolute;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    z-index: 8;
    user-select: none;
    touch-action: none;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
  }
  #actions.show { display: flex; }
  #actions .abtn {
    min-width: 72px;
    height: 72px;
    padding: 0 14px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(70,46,28,0.94), rgba(36,24,14,0.94));
    border: 3px solid #d4a86a;
    box-shadow: inset 0 1px 0 rgba(255,240,200,0.22), 0 4px 12px rgba(0,0,0,0.45);
    color: #fff8ee;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    line-height: 1.1;
  }
  #actions .abtn .ico { font-size: 22px; line-height: 1; }
  #actions .abtn.active, #actions .abtn:active {
    background: linear-gradient(180deg, rgba(240,193,75,0.8), rgba(160,100,30,0.9));
    border-color: #ffe08a;
  }
  #actions .abtn.close {
    min-width: 64px; height: 64px;
    border-color: #c87858;
    background: linear-gradient(180deg, rgba(90,40,28,0.94), rgba(50,22,16,0.94));
  }
  /* Desktop: keep aspect, centered, no forced letterbox waste on phone */
  @media (min-width: 700px) and (hover: hover) and (pointer: fine) {
    html, body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1008;
      position: static;
    }
    #wrap {
      position: relative;
      width: min(420px, 42vw);
      height: min(746px, 94dvh);
      inset: auto;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 0 0 3px #5c3a22,
        0 0 0 5px #c49a6c,
        0 20px 60px rgba(0,0,0,0.65);
    }
  }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="360" height="640"></canvas>
<div id="dpad" aria-hidden="true">
  <div class="btn up" data-dir="up">▲</div>
  <div class="btn left" data-dir="left">◀</div>
  <div class="btn center">+</div>
  <div class="btn right" data-dir="right">▶</div>
  <div class="btn down" data-dir="down">▼</div>
</div>
<div id="actions" aria-hidden="true">
  <button type="button" class="abtn close" id="btnClose" title="關閉"><span class="ico">✕</span><span>關閉</span></button>
  <button type="button" class="abtn" id="btnAct" title="互動"><span class="ico">✦</span><span>互動</span></button>
</div>
</div>

    if (!s || !atlasReady) return;
    const x = (dx + 0.5) | 0, y = (dy + 0.5) | 0;
    if (flipX) {
      ctx.save();
      ctx.translate(x + s.w, y);
      ctx.scale(-1, 1);
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, 0, 0, s.w, s.h);
      ctx.restore();
    } else {
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, x, y, s.w, s.h);
    }
  }

  function blitScaled(name, dx, dy, scale, flipX) {
    const s = SPR[name];
    if (!s || !atlasReady) return;
    const dw = (s.w * scale + 0.5) | 0, dh = (s.h * scale + 0.5) | 0;
    const x = (dx + 0.5) | 0, y = (dy + 0.5) | 0;
    if (flipX) {
      ctx.save();
      ctx.translate(x + dw, y);
      ctx.scale(-1, 1);
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, 0, 0, dw, dh);
      ctx.restore();
    } else {
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, x, y, dw, dh);
    }
  }

  function blitStretch(name, dx, dy, dw, dh) {
    const s = SPR[name];
    if (!s || !atlasReady) return;
    ctx.drawImage(atlas, s.x, s.y, s.w, s.h, (dx+0.5)|0, (dy+0.5)|0, (dw+0.5)|0, (dh+0.5)|0);
  }

  function blitTiled(name, dx, dy, dw, dh) {
    const s = SPR[name];
    if (!s || !atlasReady) return;
    const x0 = (dx+0.5)|0, y0 = (dy+0.5)|0;
    const x1 = x0 + ((dw+0.5)|0), y1 = y0 + ((dh+0.5)|0);
    for (let y = y0; y < y1; y += s.h) {
      for (let x = x0; x < x1; x += s.w) {
        const tw = Math.min(s.w, x1 - x);
        const th = Math.min(s.h, y1 - y);
        ctx.drawImage(atlas, s.x, s.y, tw, th, x, y, tw, th);
      }
    }
  }

  function detectTouchUI() {

  function interactNearest() {
    const cx = teacher.x + teacher.w / 2;

    let best = null, bestD = 1e9;
    for (const z of zones) {
      const zx = z.x + z.w / 2, zy = z.y + z.h / 2;
      const d = Math.hypot(cx - zx, cy - zy);
      const inside = cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h;
      const score = inside ? d * 0.3 : d;
      if (score < bestD) { bestD = score; best = z; }

  function canvasPoint(ev) {
    const r = canvas.getBoundingClientRect();
    const sx = W / r.width, sy = H / r.height;
    let cx, cy;
    if (ev.touches && ev.touches.length) {
      cx = ev.touches[0].clientX; cy = ev.touches[0].clientY;
    } else if (ev.changedTouches && ev.changedTouches.length) {
      cx = ev.changedTouches[0].clientX; cy = ev.changedTouches[0].clientY;
    } else {
      cx = ev.clientX; cy = ev.clientY;
    }
    return { x: (cx - r.left) * sx, y: (cy - r.top) * sy };
  }

  function hitZone(px, py) {
    for (let i = zones.length - 1; i >= 0; i--) {

    }
    return null;

  function hitRect(p, r) {
    return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  function screenToWorld(p) {

      const pw = panel.pw || 300, ph = panel.ph || 130;
      const inside = p.x >= panel.x && p.x <= panel.x + pw && p.y >= panel.y && p.y <= panel.y + ph;
      if (!inside) { panel = null; highlightZone = -1; return; }
      return;

    const w = screenToWorld(p);
    const z = hitZone(w.x, w.y);

  /* HTML D-pad */
  (function setupDpad() {
    const dpad = document.getElementById("dpad");

      const on = (ev) => { ev.preventDefault(); ev.stopPropagation(); setDir(dir, true); };

      el.addEventListener("touchstart", on, { passive: false });
      el.addEventListener("touchend", off, { passive: false });
      el.addEventListener("touchcancel", off, { passive: false });

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* Fair furniture AABB: collide with the solid base, not the tall visual (monitors etc.) */
  function solidHitbox(s) {
    if (s.kind === "door") return null;
    if (s.kind === "desk" || s.kind === "teacherDesk") {
      return { x: s.x + 6, y: s.y + s.h - 16, w: s.w - 12, h: 16 };
    }
    if (s.kind === "round") {
      return { x: s.x + 10, y: s.y + 12, w: s.w - 20, h: s.h - 22 };
    }
    if (s.kind === "shelf") {
      return { x: s.x + 4, y: s.y + 6, w: s.w - 8, h: s.h - 8 };
    }
    if (s.kind === "cabinet") {
      return { x: s.x + 4, y: s.y + 10, w: s.w - 8, h: s.h - 12 };
    }
    if (s.kind === "board") {
      return { x: s.x + 8, y: s.y, w: s.w - 16, h: Math.max(8, s.h - 2) };
    }
    if (s.kind === "plant") {
      return { x: s.x + 5, y: s.y + 14, w: s.w - 10, h: s.h - 14 };
    }
    return { x: s.x + 2, y: s.y + Math.max(0, s.h - 14), w: s.w - 4, h: Math.min(s.h, 16) };
  }

  /* Foot AABB — only the soles collide, so shoulders can overlap desk tops fairly */
  function footBox(nx, ny, ent) {
    const w = ent.w, h = ent.h;
    return {
      x: nx + 3,
      y: ny + h - 7,
      w: w - 6,
      h: 6,
    };
  }

  function blockedAt(nx, ny, ent) {
    const box = footBox(nx, ny, ent);
    if (box.x < room.x + 2 || box.y < room.y + 6 ||
        box.x + box.w > room.x + room.w - 2 ||
        box.y + box.h > room.y + room.h - 2) return true;
    for (const s of solids) {
      const hit = solidHitbox(s);
      if (!hit) continue;
      if (rectsOverlap(box, hit)) return true;
    }
    return false;
  }

  function setFacingFromInput(ent, ix, iy) {
    if (ix === 0 && iy === 0) return;
    if (Math.abs(ix) > Math.abs(iy)) ent.facing = ix < 0 ? 1 : 2;
    else if (Math.abs(iy) > Math.abs(ix)) ent.facing = iy < 0 ? 3 : 0;
    else {
      /* diagonal: prefer the axis that matches current facing if possible, else horizontal */
      if (ent.facing === 1 || ent.facing === 2) ent.facing = ix < 0 ? 1 : 2;
      else ent.facing = iy < 0 ? 3 : 0;
    }
  }

  function moveAABB(ent, vx, vy) {
    let mx = 0, my = 0;
    if (vx && !blockedAt(ent.x + vx, ent.y, ent)) { ent.x += vx; mx = vx; }
    if (vy && !blockedAt(ent.x, ent.y + vy, ent)) { ent.y += vy; my = vy; }
    /* corner slide: if both blocked individually but we wanted diagonal, already handled */
    const dist = Math.hypot(mx, my);
    if (dist > 0.01) {
      ent.state = "walk";
      ent.animDist += dist;
      ent.vx = mx; ent.vy = my;
    } else {
      ent.state = "idle";
      ent.vx = 0; ent.vy = 0;
    }
    return dist;
  }

  function walkFrameFromDist(ent) {
    if (ent.state !== "walk") return 0;
    /* stride ~5px per frame → 4-frame cycle synced to velocity */
    return ((ent.animDist / 5) | 0) % 4;
  }

  function updateTeacher() {
    let ix = 0, iy = 0;
    if (keys["ArrowLeft"] || keys["KeyA"] || touchPad.left) ix -= 1;
    if (keys["ArrowRight"] || keys["KeyD"] || touchPad.right) ix += 1;
    if (keys["ArrowUp"] || keys["KeyW"] || touchPad.up) iy -= 1;
    if (keys["ArrowDown"] || keys["KeyS"] || touchPad.down) iy += 1;

    if (ix || iy) {
      const len = Math.hypot(ix, iy) || 1;
      const vx = (ix / len) * teacher.speed;
      const vy = (iy / len) * teacher.speed;
      setFacingFromInput(teacher, ix, iy);
      moveAABB(teacher, vx, vy);
    } else {
      teacher.state = "idle";
      teacher.vx = 0; teacher.vy = 0;
    }
  }

  function updateStudents() {
    for (const s of students) {
      if (s.seated) { s.bob += 0.035; s.state = "idle"; continue; }
      if (!s.path) continue;
      const target = s.path[s.pi];
      const dx = target.x - s.x, dy = target.y - s.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 1.5) {
        s.pi = (s.pi + 1) % s.path.length;
        s.state = "idle";
        s.vx = 0; s.vy = 0;
      } else {
        const sp = s.speed || 0.5;
        const vx = (dx / dist) * sp;
        const vy = (dy / dist) * sp;
        setFacingFromInput(s, dx, dy);
        /* NPCs soft-move (no hard desk collision on patrol path) */
        s.x += vx; s.y += vy;
        s.state = "walk";
        s.animDist += sp;
        s.vx = vx; s.vy = vy;
      }
    }
  }

  function updateCat() {
    cat.blink++;
    if (cat.state !== "walk") {
      if (cat.blink > 180) {
        cat.asleep = !cat.asleep;
        cat.blink = 0;
        if (!cat.asleep && Math.random() < 0.45) {
          const spots = [
            { x: deskPositions[1].x + 20, y: deskPositions[1].y - 8 },
            { x: deskPositions[3].x + 40, y: deskPositions[3].y - 6 },
            { x: room.x + 80, y: room.y + 430 },
            { x: room.x + 240, y: room.y + 430 },
            { x: cat.homeX, y: cat.homeY },
          ];
          const pick = spots[(Math.random() * spots.length) | 0];
          cat.tx = pick.x; cat.ty = pick.y;
          cat.state = "walk";
          cat.asleep = false;
        }
      }
    } else {
      const dx = cat.tx - cat.x, dy = cat.ty - cat.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 1.5) {
        cat.x = cat.tx; cat.y = cat.ty;
        cat.state = "idle";
        cat.asleep = Math.random() < 0.6;
        cat.blink = 0; cat.animDist = 0;
        cat.vx = 0; cat.vy = 0;
      } else {
        const vx = (dx / dist) * cat.speed;
        const vy = (dy / dist) * cat.speed;
        cat.x += vx; cat.y += vy;
        cat.animDist += cat.speed;
        cat.vx = vx; cat.vy = vy;
        setFacingFromInput(cat, dx, dy);
        cat.asleep = false;
      }
    }
  }

  function updateCamera() {
    /* Soft follow with look-ahead in facing direction; clamp to room */
    const look = 18;
    let lx = 0, ly = 0;
    if (teacher.facing === 1) lx = -look;
    else if (teacher.facing === 2) lx = look;
    else if (teacher.facing === 3) ly = -look;
    else ly = look;
    const cx = teacher.x + teacher.w / 2 + lx;
    const cy = teacher.y + teacher.h / 2 + ly;
    const viewH = H - BAR_H;
    cam.tx = cx - W / 2;
    cam.ty = cy - viewH / 2;
    const maxX = Math.max(0, (room.x + room.w) - W);
    const maxY = Math.max(0, (room.y + room.h) - viewH);
    cam.tx = Math.max(0, Math.min(cam.tx, maxX));
    cam.ty = Math.max(0, Math.min(cam.ty, maxY));
    /* ease */
    cam.x += (cam.tx - cam.x) * 0.12;
    cam.y += (cam.ty - cam.y) * 0.12;
    if (Math.abs(cam.tx - cam.x) < 0.05) cam.x = cam.tx;
    if (Math.abs(cam.ty - cam.y) < 0.05) cam.y = cam.ty;
  }

  function fillRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect((x + 0.5) | 0, (y + 0.5) | 0, (w + 0.5) | 0, (h + 0.5) | 0);
  }

  function roundPanel(x, y, w, h, fill, border) {
    fillRect(x + 3, y + 3, w, h, "rgba(0,0,0,0.4)");
    fillRect(x, y, w, h, fill);
    fillRect(x, y, w, 4, C.uiAccent);
    fillRect(x, y, 3, h, border);
    fillRect(x + w - 3, y, 3, h, border);
    fillRect(x, y + h - 3, w, 3, border);
  }

  function drawFloor() {
    const tw = 32, th = 16;
    for (let ty = room.y; ty < room.y + room.h; ty += th) {
      const row = ((ty - room.y) / th) | 0;
      const offset = (row % 2) * (tw / 2);
      for (let tx = room.x - tw; tx < room.x + room.w + tw; tx += tw) {
        const px = tx + offset;
        if (px + tw < room.x || px > room.x + room.w) continue;
        const variant = ((row * 3 + ((tx / tw) | 0) * 7) % 4);
        const clipX = Math.max(px, room.x);
        const clipW = Math.min(px + tw, room.x + room.w) - clipX;
        if (clipW <= 0) continue;
        const s = SPR["floor" + variant];
        if (!s || !atlasReady) {
          fillRect(clipX, ty, clipW, th, C.floor);
          continue;
        }
        const srcOff = clipX - px;
        ctx.drawImage(atlas, s.x + srcOff, s.y, clipW, Math.min(th, s.h), clipX, ty, clipW, th);
      }
    }
    /* warm wood grain wash */
    ctx.fillStyle = "rgba(180,120,60,0.06)";
    fillRect(room.x, room.y, room.w, room.h);
  }

  function drawCarpet() {
    const c = carpet;
    fillRect(c.x + 3, c.y + 3, c.w, c.h, "rgba(30,18,8,0.3)");
    blitTiled("carpet", c.x, c.y, c.w, c.h);
    fillRect(c.x, c.y, c.w, 4, "#c87858");
    fillRect(c.x, c.y + c.h - 4, c.w, 4, "#c87858");
    fillRect(c.x, c.y, 4, c.h, "#c87858");
    fillRect(c.x + c.w - 4, c.y, 4, c.h, "#c87858");
    fillRect(c.x + 6, c.y + 6, c.w - 12, 2, "rgba(154,90,72,0.75)");
    fillRect(c.x + 6, c.y + c.h - 8, c.w - 12, 2, "rgba(154,90,72,0.75)");
  }

  function drawWalls() {
    blitTiled("wall", 0, 0, W, WALL_T);
    fillRect(0, 0, WALL_S, H - BAR_H, C.wall);
    fillRect(W - WALL_S, 0, WALL_S, H - BAR_H, C.wallDark);
    for (let y = 4; y < WALL_T - 4; y += 6) fillRect(0, y, WALL_S, 1, "#e4d0b0");
    for (let y = 4; y < H - BAR_H - 4; y += 10) {
      fillRect(2, y, 3, 2, "rgba(212,188,152,0.5)");
      fillRect(W - 8, y, 3, 2, "rgba(180,150,120,0.4)");
    }
    fillRect(WALL_S - 3, WALL_T, 3, room.h, C.trim);
    fillRect(W - WALL_S, WALL_T, 3, room.h, C.trimD);
    fillRect(0, room.y + room.h - 5, W, 5, C.baseboard);
    fillRect(0, room.y + room.h - 4, W, 1, C.trimL);

    /* Two large windows across top wall */
    const wins = [room.x + 40, room.x + 150, room.x + 250];
    for (const wx of wins) {
      blitScaled("window", wx - 4, 2, 1.15);
      const drift = ((frame * 0.12) + wx) % 50;
      ctx.fillStyle = "rgba(240,248,255,0.4)";
      fillRect(wx + 8 + drift * 0.35, 10, 12, 3);
      fillRect(wx + 14 + drift * 0.35, 8, 7, 2);
    }
    blitScaled("door", 0, room.y + 295, 1.15);
  }

  function drawWhiteboard() {
    blitStretch("board", room.x + 40, room.y + 8, room.w - 80, 58);
    const bx = room.x + 52, by = room.y + 22;
    ctx.textAlign = "left";
    ctx.fillStyle = C.chalk;
    ctx.font = "bold 11px monospace";
    ctx.fillText("ICT · 數據庫", bx, by);
    ctx.fillStyle = C.chalkY;
    ctx.font = "10px monospace";
    ctx.fillText("SELECT name FROM students", bx - 2, by + 16);
    ctx.fillStyle = C.chalkDim;
    ctx.fillText("WHERE class = '4A';", bx + 8, by + 30);
  }

  function drawPosters() {
    for (const p of posters) blitScaled("poster" + p.kind, p.x, p.y, 1.3);
  }

  function drawDeskUnit(d, isTeacher) {
    blitScaled("chair", d.x + d.w / 2 - 12, d.y + d.h - 4, FURN_SC * 0.95);
    if (isTeacher) {
      blitScaled("teacherDesk", d.x - 4, d.y - 6, FURN_SC * 0.95);
      blitScaled("monitor", d.x + d.w / 2 - 26, d.y - 36, FURN_SC);
    } else {
      blitScaled("desk", d.x - 4, d.y - 4, FURN_SC * 0.95);
      blitScaled("monitor", d.x + d.w / 2 - 26, d.y - 34, FURN_SC);
      const glow = (Math.sin(frame * 0.05 + d.x * 0.08) + 1) * 0.5;
      if (glow > 0.55) {
        ctx.fillStyle = "rgba(136,208,240,0.14)";
        fillRect(d.x + d.w / 2 - 20, d.y - 28, 36, 20);
      }
      blitScaled("keyboard", d.x + 18, d.y + 4, FURN_SC * 0.9);
      blitScaled("mouse", d.x + d.w - 28, d.y + 6, FURN_SC);
    }
  }

  function drawFurniture() {
    drawWhiteboard();
    drawPosters();
    for (const s of solids) {
      if (s.kind === "teacherDesk") drawDeskUnit(s, true);
      else if (s.kind === "desk") drawDeskUnit(s, false);
      else if (s.kind === "round") blitScaled("round", s.x - 4, s.y - 4, FURN_SC * 1.05);
      else if (s.kind === "shelf") blitScaled("shelf" + (s.tier || 0), s.x - 2, s.y - 2, FURN_SC * 0.85);
      else if (s.kind === "cabinet") blitScaled("cabinet", s.x, s.y - 4, FURN_SC);
      else if (s.kind === "plant") {
        const sway = Math.sin(frame * 0.03 + (s.style || 0)) * 1.2;
        blitScaled("plant" + (s.style || 0), s.x - 2 + sway, s.y - 10, FURN_SC * 1.15);
      }
    }
  }

  function drawZoneTints() {
    for (const z of zones) {
      const active = highlightZone === z.id || hoverZone === z;
      fillRect(z.x, z.y, z.w, z.h, active ? C.highlight : z.color);
      if (active) {
        fillRect(z.x, z.y, z.w, 3, "rgba(240,193,75,0.6)");
        fillRect(z.x, z.y + z.h - 3, z.w, 3, "rgba(240,193,75,0.6)");
        fillRect(z.x, z.y, 3, z.h, "rgba(240,193,75,0.6)");
        fillRect(z.x + z.w - 3, z.y, 3, z.h, "rgba(240,193,75,0.6)");
      }
    }
  }

  function drawZoneLabels() {
    ctx.textAlign = "left";
    for (const z of zones) {
      const label = z.key + " · " + z.name;
      ctx.font = "bold 14px monospace";
      const tw = ctx.measureText(label).width;
      fillRect(z.x + 6, z.y + 6, tw + 16, 22, "rgba(255,248,238,0.94)");
      fillRect(z.x + 6, z.y + 6, 5, 22, C.uiAccent);
      fillRect(z.x + 6, z.y + 26, tw + 16, 2, "rgba(196,154,108,0.65)");
      ctx.fillStyle = C.zoneLabel;
      ctx.fillText(label, z.x + 16, z.y + 22);
    }
  }

  /* ── Minimal Pixel Art characters (16×24 / 16×12) — procedural, clean faces ── */
  const PX = {
    skin: "#f0c8a8", skinS: "#d4a080",
    eye: "#1a1420", mouth: "#c87868",
    tHair: "#2c2438",
    tShirt: "#3a6ea5", tShirtL: "#5a8ec5", tCollar: "#fff8ee", tBadge: "#f0c14b",
    tPants: "#2a3548", shoe: "#1a1420",
    cat: "#d4a06a", catL: "#f0d0a8", catD: "#a07040",
    catNose: "#e87890", catIris: "#68a858", catEar: "#e8a0a8",
  };

  function px(ox, oy, S, x, y, w, h, col) {
    if (!col) return;
    ctx.fillStyle = col;
    ctx.fillRect(((ox + x * S) + 0.5) | 0, ((oy + y * S) + 0.5) | 0, (w * S + 0.5) | 0, (h * S + 0.5) | 0);
  }

  /* Clean front face: symmetric 1×1 eyes, 2×1 mouth — no grotesque blobs */
  function drawFaceDown(ox, oy, S, hair) {
    px(ox, oy, S, 3, 0, 10, 2, hair);
    px(ox, oy, S, 2, 1, 12, 2, hair);
    px(ox, oy, S, 2, 2, 2, 3, hair); px(ox, oy, S, 12, 2, 2, 3, hair);
    px(ox, oy, S, 4, 2, 8, 1, hair); /* bangs */
    px(ox, oy, S, 3, 2, 10, 5, PX.skin);
    px(ox, oy, S, 5, 4, 1, 1, PX.eye); px(ox, oy, S, 10, 4, 1, 1, PX.eye);
    px(ox, oy, S, 7, 6, 2, 1, PX.mouth);
  }

  function drawFaceUp(ox, oy, S, hair) {
    px(ox, oy, S, 3, 0, 10, 2, hair);
    px(ox, oy, S, 2, 1, 12, 6, hair);
    px(ox, oy, S, 3, 6, 10, 1, PX.skinS); /* neck hint */
  }

  function drawFaceSide(ox, oy, S, hair, facingLeft) {
    /* Mirror coordinates so left/right share one clean profile */
    function X(x, w) { return facingLeft ? x : (16 - x - w); }
    px(ox, oy, S, X(3, 10), 0, 10, 2, hair);
    px(ox, oy, S, X(2, 12), 1, 12, 2, hair);
    px(ox, oy, S, X(3, 10), 2, 10, 5, PX.skin);
    px(ox, oy, S, X(2, 4), 2, 4, 5, hair); /* hair bulk at back */
    px(ox, oy, S, X(2, 2), 3, 2, 2, PX.skinS); /* ear */
    px(ox, oy, S, X(9, 1), 4, 1, 1, PX.eye);   /* one readable eye */
    px(ox, oy, S, X(8, 2), 6, 2, 1, PX.mouth);
  }

  function legOffsets(frame) {
    /* 0 idle, 1 L forward, 2 plant, 3 R forward */
    if (frame === 1) return { l: -1, r: 1, bob: 0 };
    if (frame === 2) return { l: 0, r: 0, bob: -1 };
    if (frame === 3) return { l: 1, r: -1, bob: 0 };
    return { l: 0, r: 0, bob: 0 };
  }

  function drawHuman(ox, oy, facing, frame, seated, pal) {
    const S = CHAR_SCALE;
    const hair = pal.hair;
    const shirt = pal.shirt;
    const pants = pal.pants;
    const isTeacher = !!pal.badge;
    const legs = legOffsets(seated ? 0 : frame);
    const bob = seated ? 0 : legs.bob;

    oy = oy + bob * S;

    if (facing === 0) drawFaceDown(ox, oy, S, hair);
    else if (facing === 3) drawFaceUp(ox, oy, S, hair);
    else drawFaceSide(ox, oy, S, hair, facing === 1);

    /* torso */
    if (facing === 3) {
      /* back of shirt */
      px(ox, oy, S, 3, 8, 10, 1, shirt);
      px(ox, oy, S, 2, 9, 12, 5, shirt);
      px(ox, oy, S, 3, 14, 10, 1, shirt);
    } else if (facing === 0) {
      if (isTeacher) {
        px(ox, oy, S, 3, 8, 10, 1, PX.tCollar);
        px(ox, oy, S, 2, 9, 12, 1, shirt);
        px(ox, oy, S, 7, 9, 2, 1, pal.badge);
        px(ox, oy, S, 1, 10, 14, 4, shirt);
        px(ox, oy, S, 2, 14, 12, 1, shirt);
      } else {
        px(ox, oy, S, 3, 8, 10, 1, "#fff8ee");
        px(ox, oy, S, 2, 9, 12, 6, shirt);
        /* hands */
        px(ox, oy, S, 1, 12, 2, 2, PX.skin);
        px(ox, oy, S, 13, 12, 2, 2, PX.skin);
      }
    } else {
      /* side torso */
      px(ox, oy, S, 4, 8, 8, 7, shirt);
      px(ox, oy, S, facing === 1 ? 3 : 11, 11, 2, 2, PX.skin); /* near hand */
    }

    if (seated) {
      /* seated: shorter legs tucked */
      px(ox, oy, S, 4, 15, 8, 3, pants);
      px(ox, oy, S, 3, 17, 4, 2, PX.shoe);
      px(ox, oy, S, 9, 17, 4, 2, PX.shoe);
      return;
    }

    /* walking / idle legs — 4-dir */
    if (facing === 1 || facing === 2) {
      /* side-view legs: overlap with stride */
      const front = legs.l;
      const back = legs.r;
      px(ox, oy, S, 6, 15 + back, 3, 6, pants);
      px(ox, oy, S, 6, 21 + back, 3, 2, PX.shoe);
      px(ox, oy, S, 8, 15 + front, 3, 6, pants);
      px(ox, oy, S, 8, 21 + front, 3, 2, PX.shoe);
    } else {
      px(ox, oy, S, 4, 15 + legs.l, 3, 6, pants);
      px(ox, oy, S, 9, 15 + legs.r, 3, 6, pants);
      px(ox, oy, S, 4, 21 + legs.l, 3, 2, PX.shoe);
      px(ox, oy, S, 9, 21 + legs.r, 3, 2, PX.shoe);
    }
  }

  function drawCatProc(ox, oy, facing, frame, asleep, loaf) {
    const S = CHAR_SCALE;
    const bob = (frame === 1 || frame === 3) ? -1 : 0;
    oy = oy + bob * S;

    if (asleep) {
      /* loaf asleep — closed eyes as dashes */
      px(ox, oy, S, 2, 2, 12, 8, PX.cat);
      px(ox, oy, S, 1, 4, 14, 5, PX.cat);
      px(ox, oy, S, 3, 1, 2, 2, PX.cat); px(ox, oy, S, 11, 1, 2, 2, PX.cat);
      px(ox, oy, S, 3, 1, 1, 1, PX.catEar); px(ox, oy, S, 12, 1, 1, 1, PX.catEar);
      px(ox, oy, S, 4, 4, 8, 4, PX.catL);
      px(ox, oy, S, 5, 5, 2, 1, PX.eye); px(ox, oy, S, 9, 5, 2, 1, PX.eye); /* - - */
      px(ox, oy, S, 7, 7, 2, 1, PX.catNose);
      px(ox, oy, S, 2, 9, 2, 2, PX.catD); px(ox, oy, S, 12, 9, 2, 2, PX.catD);
      return;
    }

    /* ears */
    px(ox, oy, S, 3, 0, 2, 2, PX.cat); px(ox, oy, S, 11, 0, 2, 2, PX.cat);
    px(ox, oy, S, 3, 0, 1, 1, PX.catEar); px(ox, oy, S, 12, 0, 1, 1, PX.catEar);

    if (facing === 1 || facing === 2) {
      /* side */
      const left = facing === 1;
      px(ox, oy, S, 2, 2, 11, 7, PX.cat);
      px(ox, oy, S, left ? 3 : 8, 3, 5, 4, PX.catL);
      px(ox, oy, S, left ? 5 : 10, 4, 1, 1, PX.eye);
      px(ox, oy, S, left ? 6 : 9, 4, 1, 1, PX.catIris);
      px(ox, oy, S, left ? 7 : 8, 6, 1, 1, PX.catNose);
      /* legs */
      px(ox, oy, S, 3, 9, 2, 2, PX.catD);
      px(ox, oy, S, 6, 9 + (frame % 2), 2, 2, PX.catD);
      px(ox, oy, S, 9, 9 + ((frame + 1) % 2), 2, 2, PX.catD);
      /* tail */
      px(ox, oy, S, left ? 12 : 1, 4, 2, 1, PX.catD);
      px(ox, oy, S, left ? 13 : 0, 3, 2, 1, PX.cat);
    } else {
      /* front / back */
      px(ox, oy, S, 2, 2, 12, 7, PX.cat);
      if (facing === 0) {
        px(ox, oy, S, 4, 3, 8, 5, PX.catL);
        px(ox, oy, S, 5, 4, 1, 1, PX.eye); px(ox, oy, S, 6, 4, 1, 1, PX.catIris);
        px(ox, oy, S, 9, 4, 1, 1, PX.eye); px(ox, oy, S, 10, 4, 1, 1, PX.catIris);
        px(ox, oy, S, 7, 6, 2, 1, PX.catNose);
        px(ox, oy, S, 7, 7, 2, 1, PX.mouth);
      } else {
        px(ox, oy, S, 3, 2, 10, 6, PX.cat);
        px(ox, oy, S, 7, 3, 2, 4, PX.catD); /* back stripe */
      }
      px(ox, oy, S, 3, 9, 2, 2, PX.catD);
      px(ox, oy, S, 7, 9, 2, 2, PX.catD);
      px(ox, oy, S, 11, 9, 2, 2, PX.catD);
    }
  }

  function drawTeacherSprite() {
    const f = walkFrameFromDist(teacher);
    const pal = {
      hair: PX.tHair, shirt: PX.tShirt, pants: PX.tPants, badge: PX.tBadge,
    };
    drawHuman(teacher.x, teacher.y, teacher.facing, f, false, pal);
  }

  function drawStudentSprite(s) {
    const base = studentPalettes[s.pal % studentPalettes.length];
    const pal = { hair: base.hair, shirt: base.shirt, pants: base.pants };
    const bob = s.seated ? Math.sin(s.bob) * 0.6 : 0;
    const f = walkFrameFromDist(s);
    drawHuman(s.x, s.y + bob, s.facing, f, !!s.seated, pal);
  }

  function drawCatSprite() {
    const f = cat.state === "walk" ? (((cat.animDist / 4) | 0) % 4) : 0;
    drawCatProc(cat.x, cat.y, cat.facing, f, !!cat.asleep && cat.state !== "walk", cat.state === "idle" && !cat.asleep);
    if (cat.asleep && cat.state !== "walk" && frame % 50 < 25) {
      ctx.fillStyle = C.uiDim;
      ctx.font = "12px monospace";
      ctx.textAlign = "left";
      ctx.fillText("z", cat.x + 28, cat.y);
      if (frame % 50 < 12) ctx.fillText("z", cat.x + 36, cat.y - 8);
    }
  }

  function drawEntities() {
    const ents = [];
    for (const s of students) {
      ents.push({
        y: s.y + s.h,
        draw: () => drawStudentSprite(s),
      });
    }
    ents.push({ y: cat.y + cat.h, draw: drawCatSprite });
    ents.push({ y: teacher.y + teacher.h, draw: drawTeacherSprite });
    ents.sort((a, b) => a.y - b.y);
    for (const e of ents) e.draw();
  }

  function drawLighting() {
    const windows = [room.x + 40, room.x + 150, room.x + 250];
    for (const wx of windows) {
      blitStretch("warmGlow", wx - 16, WALL_T - 6, 110, 160);
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = "rgba(255,210,120," + (0.04 - i * 0.004) + ")";
        fillRect(wx + 4 - i * 2, WALL_T + i * 12, 78 + i * 5, 14);
      }
    }
    /* soft overhead lamp glows over computer zone */
    blitStretch("warmGlow", room.x + 40, room.y + 140, 120, 100);
    blitStretch("warmGlow", room.x + 200, room.y + 140, 120, 100);
    blitStretch("warmGlow", room.x + 80, room.y + 380, 160, 90);

    blitStretch("vignetteCorner", 0, 0, 90, 90);
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    blitStretch("vignetteCorner", 0, 0, 90, 90);
    ctx.restore();
    ctx.save();
    ctx.translate(0, H - BAR_H); ctx.scale(1, -1);
    blitStretch("vignetteCorner", 0, 0, 90, 80);
    ctx.restore();
    ctx.save();
    ctx.translate(W, H - BAR_H); ctx.scale(-1, -1);
    blitStretch("vignetteCorner", 0, 0, 90, 80);
    ctx.restore();

    ctx.fillStyle = "rgba(255,220,150,0.09)";
    fillRect(room.x, room.y, room.w, room.h);
    /* subtle scanline warmth */
    if (frame % 2 === 0) {
      ctx.fillStyle = "rgba(255,240,200,0.015)";
      for (let y = room.y; y < room.y + room.h; y += 4) fillRect(room.x, y, room.w, 1);
    }
  }

  function drawUIBar() {
    const barY = H - BAR_H;
    fillRect(0, barY, W, BAR_H, C.uiPanel);
    fillRect(0, barY, W, 3, C.uiPanelBorder);
    fillRect(0, barY + 3, W, 2, C.uiAccent);
    fillRect(0, barY + 5, W, BAR_H - 5, C.uiPanelMid);
    fillRect(0, barY + 5, W, 1, "rgba(255,248,238,0.07)");

    /* stacked chips for portrait */
    fillRect(8, barY + 10, W - 16, 22, C.uiChip);
    fillRect(8, barY + 10, 4, 22, C.uiAccent);
    ctx.fillStyle = C.ui;
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "left";
    ctx.fillText("第 3 節 · 中四 ICT", 18, barY + 25);

    fillRect(8, barY + 36, W - 16, 22, C.uiChipAlt);
    fillRect(8, barY + 36, 4, 22, "#68a858");
    ctx.fillStyle = C.uiAccent;
    ctx.font = "bold 11px monospace";
    ctx.fillText("進行中", 18, barY + 51);
    ctx.fillStyle = C.ui;
    ctx.fillText("SBA 草稿檢查 · Tsao", 70, barY + 51);
  }

  function drawPanel() {
    if (!panel) return;
    const { x, y, title, info } = panel;
    const pw = panel.pw || 300, ph = panel.ph || 130;
    roundPanel(x, y, pw, ph, C.uiPanel, C.uiPanelBorder);
    fillRect(x + 4, y + 6, pw - 8, ph - 10, C.uiPanelMid);

    closeBtn = { x: x + pw - 40, y: y + 10, w: 32, h: 32 };
    fillRect(closeBtn.x, closeBtn.y, closeBtn.w, closeBtn.h, "#5a3020");
    fillRect(closeBtn.x, closeBtn.y, closeBtn.w, 3, C.uiAccent);
    ctx.fillStyle = C.titleCream;
    ctx.font = "bold 18px monospace";
    ctx.textAlign = "center";
    ctx.fillText("✕", closeBtn.x + closeBtn.w / 2, closeBtn.y + 23);

    ctx.fillStyle = C.titleGold;
    ctx.font = "bold 17px monospace";
    ctx.textAlign = "left";
    ctx.fillText("▸ " + title, x + 14, y + 34);

    ctx.fillStyle = C.ui;
    ctx.font = "13px monospace";
    const maxW = pw - 28;
    let line = "", ly = y + 58;
    for (const ch of info) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW) {
        ctx.fillText(line, x + 14, ly);
        line = ch; ly += 17;
        if (ly > y + ph - 28) break;
      } else line = test;
    }
    if (line && ly <= y + ph - 28) ctx.fillText(line, x + 14, ly);

    ctx.fillStyle = C.uiDim;
    ctx.font = "11px monospace";
    ctx.fillText("點外面／✕／關閉鍵", x + 14, y + ph - 12);
  }

  function drawTitle() {
    fillRect(0, 0, W, H, C.overlay);
    /* ambient room peek */
    if (atlasReady) {
      blitScaled("warmGlow", W / 2 - 80, H / 2 - 120, 2.5);
    }
    const tw = Math.min(320, W - 28);
    const th = 280;
    const tx = (W - tw) / 2, ty = (H - th) / 2 - 20;
    roundPanel(tx, ty, tw, th, C.uiPanel, C.uiPanelBorder);
    fillRect(tx + 5, ty + 8, tw - 10, th - 14, C.uiPanelMid);

    blitScaled("monitor", tx + 16, ty + 24, 1.6);
    blitScaled("plant0", tx + tw - 56, ty + 22, 1.7);
    drawCatProc(tx + 18, ty + th - 70, 0, 0, false, true);
    blitScaled("poster0", tx + tw - 62, ty + th - 80, 1.5);

    ctx.textAlign = "center";
    ctx.fillStyle = C.titleGold;
    ctx.font = "bold 42px monospace";
    ctx.fillText("像素課室", W / 2, ty + 78);
    fillRect(W / 2 - 70, ty + 88, 140, 3, C.uiAccent);

    ctx.fillStyle = C.titleCream;
    ctx.font = "15px monospace";
    ctx.fillText("上課，像玩遊戲一樣", W / 2, ty + 118);

    ctx.fillStyle = C.uiDim;
    ctx.font = "11px monospace";
    ctx.fillText("香港中學 ICT 電腦室", W / 2, ty + 142);
    ctx.fillText("Teacher Lap Cheung Tsao", W / 2, ty + 158);

    startBtn = { x: W / 2 - 120, y: ty + 180, w: 240, h: 56 };
    const blink = Math.floor(frame / 26) % 2 === 0;
    fillRect(startBtn.x + 4, startBtn.y + 4, startBtn.w, startBtn.h, "rgba(0,0,0,0.45)");
    fillRect(startBtn.x, startBtn.y, startBtn.w, startBtn.h, blink ? "#7a4e28" : "#5a3820");
    fillRect(startBtn.x, startBtn.y, startBtn.w, 4, C.uiAccent);
    fillRect(startBtn.x, startBtn.y, 3, startBtn.h, C.uiPanelBorder);
    fillRect(startBtn.x + startBtn.w - 3, startBtn.y, 3, startBtn.h, C.uiPanelBorder);
    fillRect(startBtn.x, startBtn.y + startBtn.h - 3, startBtn.w, 3, C.uiPanelBorder);
    ctx.fillStyle = blink ? C.uiAccent : C.titleCream;
    ctx.font = "bold 20px monospace";
    ctx.fillText("▶  開始上課", W / 2, startBtn.y + 36);

    ctx.fillStyle = "rgba(255,248,238,0.45)";
    ctx.font = "11px monospace";
    ctx.fillText("觸控 · 或按 Space／Enter", W / 2, ty + th - 18);
  }

  function drawHint() {
    if (state !== STATE.PLAY || panel) return;
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,248,238,0.5)";
    ctx.font = "11px monospace";
    const hint = isTouchUI
      ? "方向鍵移動 · 點區域／互動鍵"
      : "WASD · 點區域 · 1–4 · E 互動 · Esc";
    ctx.fillText(hint, room.x + 8, room.y + room.h - 12);
  }

  function update() {
    frame++;
    if (highlightTimer > 0) {
      highlightTimer--;
      if (highlightTimer === 0) highlightZone = -1;
    }
    if (state === STATE.PLAY) {
      updateTeacher();
      updateStudents();
      updateCat();
      updateCamera();
    } else {
      cam.x += (0 - cam.x) * 0.2;
      cam.y += (0 - cam.y) * 0.2;
    }
  }

  function render() {
    ctx.imageSmoothingEnabled = false;
    fillRect(0, 0, W, H, C.bg);

    /* World layer — camera follow (portrait 360×640 playfield) */
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H - BAR_H);
    ctx.clip();
    ctx.translate(((-cam.x) + 0.5) | 0, ((-cam.y) + 0.5) | 0);
    drawWalls();
    drawFloor();
    drawCarpet();
    drawZoneTints();
    drawFurniture();
    drawEntities();
    drawLighting();
    drawZoneLabels();
    drawHint();
    ctx.restore();

    /* Screen-space UI */
    drawUIBar();
    drawPanel();
    if (state === STATE.TITLE) drawTitle();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
