    const x = (dx + 0.5) | 0, y = (dy + 0.5) | 0;
    if (flipX) {
      ctx.save();

      ctx.scale(-1, 1);
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, 0, 0, s.w, s.h);

    } else {

    }
  }

    for (const s of students) {
      if (s.seated) { s.bob += 0.035; continue; }
      if (!s.path) continue;
      const target = s.path[s.pi];
      const dx = target.x - s.x, dy = target.y - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1.2) s.pi = (s.pi + 1) % s.path.length;
      else {
        s.x += (dx / dist) * 0.42;
        s.y += (dy / dist) * 0.42;
        s.walkPhase += 0.16;
        if (Math.abs(dx) > Math.abs(dy)) s.facing = dx < 0 ? 1 : 2;
        else s.facing = dy < 0 ? 3 : 0;
      }
    }
  }

  function updateCat() {
    cat.blink++;
    if (!cat.moving) {
      if (cat.blink > 180) {
        cat.asleep = !cat.asleep;
        cat.blink = 0;
        if (!cat.asleep && Math.random() < 0.45) {
          cat.moving = true;
          const spots = [
            { x: deskPositions[4].x + 10, y: deskPositions[4].y - 4 },
            { x: deskPositions[4].x + 50, y: deskPositions[4].y - 2 },
            { x: room.x + 200, y: room.y + room.h - 40 },
            { x: room.x + 340, y: room.y + room.h - 36 },
            { x: cat.homeX, y: cat.homeY },
          ];
          const pick = spots[(Math.random() * spots.length) | 0];
          cat.tx = pick.x; cat.ty = pick.y;
        }
      }
    } else {
      const dx = cat.tx - cat.x, dy = cat.ty - cat.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1.5) {
        cat.x = cat.tx; cat.y = cat.ty;
        cat.moving = false;
        cat.asleep = Math.random() < 0.6;
        cat.blink = 0; cat.walkPhase = 0;
      } else {
        cat.x += (dx / dist) * 0.55;
        cat.y += (dy / dist) * 0.55;
        cat.walkPhase += 0.2;
        cat.facing = dx < 0 ? 1 : 2;
        cat.asleep = false;
      }
    }
  }

  function fillRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect((x + 0.5) | 0, (y + 0.5) | 0, (w + 0.5) | 0, (h + 0.5) | 0);
  }

  /* ── scene layers ── */
  function drawFloor() {
    // staggered plank rows using 4 floor variants
    const tw = 32, th = 16;
    for (let ty = room.y; ty < room.y + room.h; ty += th) {
      const row = ((ty - room.y) / th) | 0;
      const offset = (row % 2) * (tw / 2);
      for (let tx = room.x - tw; tx < room.x + room.w + tw; tx += tw) {
        const px = tx + offset;
        if (px + tw < room.x || px > room.x + room.w) continue;
        const variant = ((row * 3 + ((tx / tw) | 0) * 7) % 4);
        const clipX = Math.max(px, room.x);
        const clipW = Math.min(px + tw, room.x + room.w) - clipX;
        if (clipW <= 0) continue;
        const s = SPR["floor" + variant];
        if (!s || !atlasReady) {
          fillRect(clipX, ty, clipW, th, C.floor);
          continue;
        }
        const srcOff = clipX - px;
        ctx.drawImage(atlas, s.x + srcOff, s.y, clipW, Math.min(th, s.h), clipX, ty, clipW, th);
      }
    }
  }

  function drawCarpet() {
    const c = carpet;
    fillRect(c.x + 2, c.y + 2, c.w, c.h, "rgba(30,18,8,0.25)");
    blitTiled("carpet", c.x, c.y, c.w, c.h);
    // ornate border
    fillRect(c.x, c.y, c.w, 3, "#c87858");
    fillRect(c.x, c.y + c.h - 3, c.w, 3, "#c87858");
    fillRect(c.x, c.y, 3, c.h, "#c87858");
    fillRect(c.x + c.w - 3, c.y, 3, c.h, "#c87858");
    fillRect(c.x + 4, c.y + 4, c.w - 8, 1, "rgba(154,90,72,0.7)");
    fillRect(c.x + 4, c.y + c.h - 5, c.w - 8, 1, "rgba(154,90,72,0.7)");
  }

  function drawWalls() {
    // top wall with atlas strip tiled
    blitTiled("wall", 0, 0, W, WALL_T);
    // side walls
    fillRect(0, 0, WALL_S, H - BAR_H, C.wall);
    fillRect(W - WALL_S, 0, WALL_S, H - BAR_H, C.wallDark);
    for (let y = 4; y < WALL_T - 4; y += 6) fillRect(0, y, WALL_S, 1, "#e4d0b0");
    for (let y = 4; y < H - BAR_H - 4; y += 8) {
      fillRect(2, y, 3, 2, "rgba(212,188,152,0.5)");
      fillRect(W - 8, y, 3, 2, "rgba(180,150,120,0.4)");
    }
    // side trim
    fillRect(WALL_S - 3, WALL_T, 3, room.h, C.trim);
    fillRect(W - WALL_S, WALL_T, 3, room.h, C.trimD);
    // baseboard
    fillRect(0, room.y + room.h - 4, W, 4, C.baseboard);
    fillRect(0, room.y + room.h - 3, W, 1, C.trimL);

    // windows (animated cloud via offset blit + overlay drift)
    const wins = [room.x + 178, room.x + 272, room.x + 366];
    for (const wx of wins) {
      blit("window", wx - 3, 1);
      // soft animated cloud overlay
      const drift = ((frame * 0.12) + wx) % 50;
      ctx.fillStyle = "rgba(240,248,255,0.35)";
      fillRect(wx + 6 + drift * 0.4, 8, 10, 3);
      fillRect(wx + 10 + drift * 0.4, 6, 6, 2);
    }
    blit("door", 2, room.y + room.h - 68);
  }

  function drawWhiteboard() {
    blit("board", room.x + 10, room.y + 6);
    // live chalk text overlay (readable)
    const bx = room.x + 18, by = room.y + 16;
    ctx.textAlign = "left";
    ctx.fillStyle = C.chalk;
    ctx.font = "bold 8px monospace";
    ctx.fillText("ICT · 數據庫", bx, by);
    ctx.fillStyle = C.chalkY;
    ctx.font = "7px monospace";
    ctx.fillText("SELECT name FROM students", bx - 2, by + 12);
    ctx.fillStyle = C.chalkDim;
    ctx.fillText("WHERE class = '4A';", bx + 6, by + 22);
  }

  function drawPosters() {
    for (const p of posters) blit("poster" + p.kind, p.x, p.y);
  }

  function drawDeskUnit(d, isTeacher) {
    // chair behind desk
    blit("chair", d.x + d.w / 2 - 8, d.y + d.h - 2);
    if (isTeacher) {
      blit("teacherDesk", d.x - 2, d.y - 4);
      blit("monitor", d.x + d.w / 2 - 18, d.y - 26);
    } else {
      blit("desk", d.x - 2, d.y - 2);
      // subtle screen flicker via alternate brightness overlay
      blit("monitor", d.x + d.w / 2 - 18, d.y - 24);
      const glow = (Math.sin(frame * 0.05 + d.x * 0.08) + 1) * 0.5;
      if (glow > 0.6) {
        ctx.fillStyle = "rgba(136,208,240,0.12)";
        fillRect(d.x + d.w / 2 - 14, d.y - 21, 26, 16);
      }
      blit("keyboard", d.x + 14, d.y + 2);
      blit("mouse", d.x + d.w - 18, d.y + 3);
    }
  }

  function drawFurniture() {
    drawWhiteboard();
    drawPosters();
    for (const s of solids) {
      if (s.kind === "teacherDesk") drawDeskUnit(s, true);
      else if (s.kind === "desk") drawDeskUnit(s, false);
      else if (s.kind === "round") blit("round", s.x - 2, s.y - 2);
      else if (s.kind === "shelf") blit("shelf" + (s.tier || 0), s.x - 2, s.y - 1);
      else if (s.kind === "cabinet") blit("cabinet", s.x, s.y);
      else if (s.kind === "plant") {
        const sway = Math.sin(frame * 0.03 + (s.style || 0)) * 1;
        blit("plant" + (s.style || 0), s.x - 1 + sway, s.y - 6);
      }
    }
  }

  function drawZoneLabels() {
    ctx.textAlign = "left";
    for (const z of zones) {
      const active = highlightZone === z.id || hoverZone === z;
      fillRect(z.x, z.y, z.w, z.h, active ? C.highlight : z.color);
      if (active) {
        fillRect(z.x, z.y, z.w, 1, "rgba(240,193,75,0.55)");
        fillRect(z.x, z.y + z.h - 1, z.w, 1, "rgba(240,193,75,0.55)");
        fillRect(z.x, z.y, 1, z.h, "rgba(240,193,75,0.55)");
        fillRect(z.x + z.w - 1, z.y, 1, z.h, "rgba(240,193,75,0.55)");
      }
      const label = z.key + " · " + z.name;
      ctx.font = "bold 9px monospace";
      const tw = ctx.measureText(label).width;
      fillRect(z.x + 4, z.y + 4, tw + 10, 13, "rgba(255,248,238,0.90)");
      fillRect(z.x + 4, z.y + 4, 3, 13, C.uiAccent);
      fillRect(z.x + 4, z.y + 16, tw + 10, 1, "rgba(196,154,108,0.6)");
      ctx.fillStyle = C.zoneLabel;
      ctx.fillText(label, z.x + 10, z.y + 14);
    }
  }

  function walkFrame(phase) {
    if (!phase) return 0;
    return ((phase * 1.5) | 0) % 4;
  }

  function drawTeacherSprite() {
    const f = walkFrame(teacher.walkPhase);
    const name = "teacher_" + teacher.facing + "_" + f;
    blit(name, teacher.x - 1, teacher.y - 2);
  }

  function drawStudentSprite(s) {
    if (s.seated) {
      const bob = Math.sin(s.bob) * 0.6;
      blit("student_sit_" + s.sprite, s.x, s.y + bob);
    } else {
      const f = walkFrame(s.walkPhase || 0);
      blit("student_walk_" + s.facing + "_" + f, s.x - 1, s.y - 2);
    }
  }

  function drawCatSprite() {
    const cx = cat.x, cy = cat.y;
    if (cat.moving) {
      const f = ((cat.walkPhase * 1.2) | 0) % 4;
      const dir = cat.facing === 1 ? 1 : 2;
      blit("cat_walk_" + dir + "_" + f, cx, cy - Math.abs(Math.sin(cat.walkPhase)));
    } else if (cat.asleep) {
      blit("cat_sleep", cx, cy);
      if (frame % 50 < 25) {
        ctx.fillStyle = C.uiDim;
        ctx.font = "6px monospace";
        ctx.textAlign = "left";
        ctx.fillText("z", cx + 22, cy);
        if (frame % 50 < 12) ctx.fillText("z", cx + 26, cy - 4);
      }
    } else {
      blit("cat_loaf", cx, cy);
    }
  }

  function drawEntities() {
    const ents = [];
    for (const s of students) {
      ents.push({
        y: s.seated ? s.y + 10 : s.y + 14,
        draw: () => drawStudentSprite(s),
      });
    }
    ents.push({ y: cat.y + 12, draw: drawCatSprite });
    ents.push({ y: teacher.y + teacher.h, draw: drawTeacherSprite });
    ents.sort((a, b) => a.y - b.y);
    for (const e of ents) e.draw();
  }

  function drawLighting() {
    const windows = [room.x + 178, room.x + 272, room.x + 366];
    for (const wx of windows) {
      // warm shaft using atlas glow stretched
      blitStretch("warmGlow", wx - 10, WALL_T - 4, 90, 120);
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = "rgba(255,210,120," + (0.035 - i * 0.004) + ")";
        fillRect(wx + 6 - i * 2, WALL_T + i * 10, 66 + i * 4, 12);
      }
    }
    // corner vignettes
    blitStretch("vignetteCorner", 0, 0, 80, 80);
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    blitStretch("vignetteCorner", 0, 0, 80, 80);
    ctx.restore();
    ctx.save();
    ctx.translate(0, H - BAR_H); ctx.scale(1, -1);
    blitStretch("vignetteCorner", 0, 0, 80, 70);
    ctx.restore();
    ctx.save();
    ctx.translate(W, H - BAR_H); ctx.scale(-1, -1);
    blitStretch("vignetteCorner", 0, 0, 80, 70);
    ctx.restore();
    // warm wash
    ctx.fillStyle = "rgba(255,220,150,0.08)";
    fillRect(room.x, room.y, room.w, room.h);
  }

  function drawUIBar() {
    const barY = H - BAR_H;
    fillRect(0, barY, W, BAR_H, C.uiPanel);
    fillRect(0, barY, W, 2, C.uiPanelBorder);
    fillRect(0, barY + 2, W, 1, C.uiAccent);
    fillRect(0, barY + 3, W, BAR_H - 3, C.uiPanelMid);
    fillRect(0, barY + 3, W, 1, "rgba(255,248,238,0.06)");

    fillRect(8, barY + 9, 128, 20, C.uiChip);
    fillRect(8, barY + 9, 3, 20, C.uiAccent);
    fillRect(8, barY + 9, 128, 1, "rgba(240,193,75,0.35)");
    ctx.fillStyle = C.ui;
    ctx.font = "bold 9px monospace";
    ctx.textAlign = "left";
    ctx.fillText("第 3 節 · 中四 ICT", 16, barY + 23);

    ctx.fillStyle = C.uiDim;
    ctx.font = "8px monospace";
    ctx.fillText("Tsao Lap Cheung · 電腦室", 146, barY + 23);

    const chipX = W - 180;
    fillRect(chipX, barY + 9, 168, 20, C.uiChipAlt);
    fillRect(chipX, barY + 9, 3, 20, "#68a858");
    fillRect(chipX, barY + 9, 168, 1, "rgba(104,168,88,0.4)");
    ctx.fillStyle = C.uiAccent;
    ctx.font = "bold 8px monospace";
    ctx.fillText("進行中", chipX + 10, barY + 23);
    ctx.fillStyle = C.ui;
    ctx.fillText("SBA 草稿檢查", chipX + 52, barY + 23);
  }

  function drawPanel() {
    if (!panel) return;
    const { x, y, title, info } = panel;
    const pw = 180, ph = 64;
    fillRect(x + 3, y + 3, pw, ph, "rgba(0,0,0,0.45)");
    fillRect(x, y, pw, ph, C.uiPanel);
    fillRect(x + 2, y + 2, pw - 4, ph - 4, C.uiPanelMid);
    fillRect(x, y, pw, 3, C.uiAccent);
    fillRect(x, y, 2, ph, C.uiPanelBorder);
    fillRect(x + pw - 2, y, 2, ph, C.uiPanelBorder);
    fillRect(x, y + ph - 2, pw, 2, C.uiPanelBorder);
    fillRect(x, y, 8, 2, C.uiAccent);
    fillRect(x + pw - 8, y, 8, 2, C.uiAccent);

    ctx.fillStyle = C.titleGold;
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "left";
    ctx.fillText("▸ " + title, x + 10, y + 18);

    ctx.fillStyle = C.ui;
    ctx.font = "8px monospace";
    const maxW = pw - 20;
    let line = "", ly = y + 34;
    for (const ch of info) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW) {
        ctx.fillText(line, x + 10, ly);
        line = ch; ly += 11;
        if (ly > y + ph - 14) break;
      } else line = test;
    }
    if (line && ly <= y + ph - 14) ctx.fillText(line, x + 10, ly);

    ctx.fillStyle = C.uiDim;
    ctx.font = "7px monospace";
    ctx.fillText("[Esc 關閉]", x + pw - 56, y + ph - 7);
  }

  function drawTitle() {
    fillRect(0, 0, W, H, C.overlay);
    const tw = 340, th = 160;
    const tx = (W - tw) / 2, ty = (H - th) / 2 - 8;
    fillRect(tx + 4, ty + 4, tw, th, "rgba(0,0,0,0.5)");
    fillRect(tx, ty, tw, th, C.uiPanel);
    fillRect(tx + 3, ty + 3, tw - 6, th - 6, C.uiPanelMid);
    fillRect(tx, ty, tw, 4, C.uiAccent);
    fillRect(tx, ty, 3, th, C.uiPanelBorder);
    fillRect(tx + tw - 3, ty, 3, th, C.uiPanelBorder);
    fillRect(tx, ty + th - 3, tw, 3, C.uiPanelBorder);

    // atlas decorations
    blit("monitor", tx + 16, ty + 18);
    blit("plant0", tx + tw - 40, ty + 20);
    blit("cat_loaf", tx + 20, ty + th - 36);
    blit("poster0", tx + tw - 48, ty + th - 48);

    ctx.textAlign = "center";
    ctx.fillStyle = C.titleGold;
    ctx.font = "bold 32px monospace";
    ctx.fillText("像素課室", W / 2, ty + 52);
    fillRect(W / 2 - 60, ty + 58, 120, 2, C.uiAccent);

    ctx.fillStyle = C.titleCream;
    ctx.font = "13px monospace";
    ctx.fillText("上課，像玩遊戲一樣", W / 2, ty + 82);

    ctx.fillStyle = C.uiDim;
    ctx.font = "9px monospace";
    ctx.fillText("香港中學 ICT 電腦室 · Teacher Lap Cheung Tsao", W / 2, ty + 104);

    const blink = Math.floor(frame / 28) % 2 === 0;
    ctx.fillStyle = blink ? C.uiAccent : C.uiDim;
    ctx.font = "bold 11px monospace";
    ctx.fillText("▶  按 Space / Enter 進入課室", W / 2, ty + 132);
  }

  function drawHint() {
    if (state !== STATE.PLAY || panel) return;
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,248,238,0.45)";
    ctx.font = "7px monospace";
    ctx.fillText("WASD／方向鍵移動 · 點擊區域 · 1–4 高亮 · Esc 關閉", room.x + 6, room.y + room.h - 8);
  }

  function update() {
    frame++;
    if (highlightTimer > 0) {
      highlightTimer--;
      if (highlightTimer === 0) highlightZone = -1;
    }
    if (state === STATE.PLAY) {
      updateTeacher();
      updateStudents();
      updateCat();
    }
  }

  function render() {
    ctx.imageSmoothingEnabled = false;
    fillRect(0, 0, W, H, C.bg);
    drawWalls();
    drawFloor();
    drawCarpet();
    drawZoneLabels();
    drawFurniture();
    drawEntities();
    drawLighting();
    drawUIBar();
    drawHint();
    drawPanel();
    if (state === STATE.TITLE) drawTitle();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // start immediately; atlas loads async but is tiny/data-uri so near-instant
  loop();
})();
</script>
</body>
</html>
