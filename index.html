<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>像素課室 · 中四 ICT · Lap Cheung Tsao</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100svh;
    height: 100dvh;
    background: #0e0906;
    overflow: hidden;
    font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", "Courier New", monospace;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100svh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    background: #120c08;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
    background: #120c08;
    cursor: crosshair;
  }
  #dpad {
    display: none;
    position: absolute;
    left: max(10px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 176px;
    height: 176px;
    z-index: 8;
    user-select: none;
    touch-action: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55));
  }
  #dpad.show { display: block; }
  #dpad .btn {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(70,46,28,0.92), rgba(40,26,16,0.92));
    border: 3px solid #d4a86a;
    box-shadow: inset 0 1px 0 rgba(255,240,200,0.25), inset 0 -2px 0 rgba(0,0,0,0.35);
    color: #fff8ee;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  #dpad .btn.active {
    background: linear-gradient(180deg, rgba(240,193,75,0.75), rgba(180,120,40,0.85));
    border-color: #ffe08a;
    transform: scale(0.96);
  }
  #dpad .up { left: 60px; top: 0; }
  #dpad .down { left: 60px; bottom: 0; }
  #dpad .left { left: 0; top: 60px; }
  #dpad .right { right: 0; top: 60px; }
  #dpad .center {
    left: 60px; top: 60px; width: 56px; height: 56px;
    border-radius: 50%; opacity: 0.4; pointer-events: none;
    font-size: 12px; border-style: dashed;
  }
  #actions {
    display: none;
    position: absolute;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    z-index: 8;
    user-select: none;
    touch-action: none;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
  }
  #actions.show { display: flex; }
  #actions .abtn {
    min-width: 72px;
    height: 72px;
    padding: 0 14px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(70,46,28,0.94), rgba(36,24,14,0.94));
    border: 3px solid #d4a86a;
    box-shadow: inset 0 1px 0 rgba(255,240,200,0.22), 0 4px 12px rgba(0,0,0,0.45);
    color: #fff8ee;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    line-height: 1.1;
  }
  #actions .abtn .ico { font-size: 22px; line-height: 1; }
  #actions .abtn.active, #actions .abtn:active {
    background: linear-gradient(180deg, rgba(240,193,75,0.8), rgba(160,100,30,0.9));
    border-color: #ffe08a;
  }
  #actions .abtn.close {
    min-width: 64px; height: 64px;
    border-color: #c87858;
    background: linear-gradient(180deg, rgba(90,40,28,0.94), rgba(50,22,16,0.94));
  }
  #rotateHint {
    display: none;
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
    z-index: 12;
    background: rgba(26,32,48,0.92);
    color: #f0c14b;
    border: 2px solid #c49a6c;
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    pointer-events: none;
    white-space: nowrap;
  }
  @media (min-width: 700px) and (hover: hover) and (pointer: fine) {
    html, body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1008;
      position: static;
    }
    #wrap {
      position: relative;
      width: min(420px, 42vw);
      height: min(746px, 94dvh);
      inset: auto;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 0 0 3px #5c3a22,
        0 0 0 5px #c49a6c,
        0 20px 60px rgba(0,0,0,0.65);
    }
  }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="360" height="640"></canvas>
<div id="rotateHint">直式全螢幕 · 大角色／大書枱</div>
<div id="dpad" aria-hidden="true">
  <div class="btn up" data-dir="up">▲</div>
  <div class="btn left" data-dir="left">◀</div>
  <div class="btn center">+</div>
  <div class="btn right" data-dir="right">▶</div>
  <div class="btn down" data-dir="down">▼</div>
</div>
<div id="actions" aria-hidden="true">
  <button type="button" class="abtn close" id="btnClose" title="關閉"><span class="ico">✕</span><span>關閉</span></button>
  <button type="button" class="abtn" id="btnAct" title="點名／互動"><span class="ico">✦</span><span>點名</span></button>
</div>
</div>
<script>
(function () {
  "use strict";
  const W = 360, H = 640;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  let SPR = {};
  const atlas = new Image();
  let atlasReady = false;

  /* —— Web Audio SFX (no CDN) —— */
  let actx = null;
  let walkCool = 0;
  function ensureAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!actx) actx = new AC();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, slideTo) {
    const a = ensureAudio();
    if (!a) return;
    const t0 = a.currentTime;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    g.gain.setValueAtTime(Math.max(0.0001, vol || 0.04), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const SFX = {
    walk() {
      if (walkCool > 0) return;
      walkCool = 14;
      tone(110 + Math.random() * 30, 0.045, "triangle", 0.018);
    },
    interact() { tone(520, 0.08, "square", 0.045); setTimeout(() => tone(780, 0.07, "square", 0.035), 50); },
    open() { tone(340, 0.09, "square", 0.04, 680); },
    close() { tone(520, 0.08, "square", 0.035, 220); },
    toggle() { tone(440, 0.06, "triangle", 0.04); setTimeout(() => tone(660, 0.08, "triangle", 0.035), 40); },
    greet() { tone(523, 0.07, "sine", 0.05); setTimeout(() => tone(659, 0.09, "sine", 0.045), 70); setTimeout(() => tone(784, 0.12, "sine", 0.04), 150); },
  };

  function blitSized(name, dx, dy, dw, dh, flipX) {
    const s = SPR[name];
    if (!s || !atlasReady) return;
    const x = (dx + 0.5) | 0, y = (dy + 0.5) | 0;
    const w = (dw + 0.5) | 0, h = (dh + 0.5) | 0;
    if (flipX) {
      ctx.save();
      ctx.translate(x + w, y);
      ctx.scale(-1, 1);
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, 0, 0, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, x, y, w, h);
    }
  }

  /** Soft elliptical ground shadow (world space). */
  function drawShadow(cx, cy, rw, rh, alpha) {
    ctx.save();
    ctx.fillStyle = "rgba(18,22,36," + (alpha == null ? 0.38 : alpha) + ")";
    ctx.beginPath();
    ctx.ellipse((cx + 0.5) | 0, (cy + 0.5) | 0, Math.max(4, rw), Math.max(2, rh), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  const C = {
    bg: "#121820",
    sky: "#4aa0e8",
    skyCloud: "#f4f8ff",
    wall: "#f2f0ea",
    wallLine: "#d0ccc4",
    wallBase: "#e8c86a",
    floorA: "#41a6f6",
    floorB: "#3590dc",
    floorHi: "#73eff7",
    ui: "#f4f7ff", uiDim: "#90a0b8",
    uiPanel: "#1a2438", uiPanelMid: "#243048", uiPanelBorder: "#8aa0c0",
    uiAccent: "#f0c14b",
    titleGold: "#f0c14b", titleCream: "#f4f7ff",
    highlight: "rgba(240,193,75,0.28)",
    zoneTint1: "rgba(46,120,90,0.12)",
    zoneTint2: "rgba(50,110,180,0.10)",
    zoneLabel: "#1a2438",
    overlay: "rgba(10,14,22,0.88)",
    present: "#3ecf8e",
    absent: "#e07070",
  };

  const STATE = { TITLE: 0, PLAY: 1 };
  let state = STATE.TITLE;
  let frame = 0;
  let panel = null;
  let highlightZone = -1;
  let highlightTimer = 0;
  let nearestStudent = null;
  let greetBubble = null; /* {x,y,text,life} */

  const BAR_H = 52;
  const TOP_H = 28;

  /* HQ desks / characters — Pixel Office CC0, phone portrait readable */
  const ROOM = { x: 0, y: TOP_H, w: 360, h: 540 };
  const DESK_W = 82, DESK_H = 64;
  const COL_X = [4, 86, 192, 274];
  const ROW_Y = [116, 198, 280, 362];
  const SPRITE_CYCLE = ["student0", "student1", "student4", "student2", "student3", "student5"];
  const CHAIR_CYCLE = ["chair0", "chair1", "chair2", "chair3", "chair4", "chair5"];
  const DESK_UNIT_CYCLE = ["desk_unit0","desk_unit1","desk_unit2","desk_unit3","desk_unit4","desk_unit5","desk_unit6","desk_unit7"];
  const STUDENT_NAMES = [
    "陳嘉怡", "李俊傑", "黃詩敏", "張家豪",
    "林婉婷", "吳志明", "鄭欣怡", "劉偉強",
    "周美玲", "何文傑", "梁芷晴", "蔡子軒",
    "謝詠詩", "馮浩然", "葉心怡", "馬啟聰"
  ];
  const GREETINGS = [
    "早晨！準備好上 ICT 未？",
    "老師好～今日學 SELECT！",
    "有問題想問！",
    "我做好功課喇。",
    "可唔可以再講一次 WHERE？",
    "今日精神十足！"
  ];

  const desks = [];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const i = r * 4 + c;
      desks.push({
        i, r, c,
        x: COL_X[c],
        y: ROW_Y[r],
        w: DESK_W,
        h: DESK_H,
        chair: CHAIR_CYCLE[i % CHAIR_CYCLE.length],
        table: "table0",
        unit: DESK_UNIT_CYCLE[i % DESK_UNIT_CYCLE.length],
      });
    }
  }

  const teacherDesk = { x: 110, y: 70, w: 140, h: 48 };

  const zones = [
    {
      id: 0, name: "講台", key: "1",
      x: 30, y: TOP_H + 4, w: 300, h: 90,
      info: "白板講解 · 今日課題：數據庫基礎（SELECT／WHERE）· 走近同學按 E／點名可點名",
      color: C.zoneTint1,
    },
    {
      id: 1, name: "課室座位", key: "2",
      x: 4, y: 112, w: 352, h: 320,
      info: "4×4 大書枱 · 16 位同學 · 走近同學點名／打招呼",
      color: C.zoneTint2,
    },
  ];

  const solids = [];
  solids.push({ x: 8, y: TOP_H + 36, w: 36, h: 40, kind: "prop" });
  solids.push({ x: 316, y: TOP_H + 36, w: 36, h: 40, kind: "prop" });
  solids.push({ x: teacherDesk.x, y: teacherDesk.y, w: teacherDesk.w, h: teacherDesk.h, kind: "desk" });
  for (const d of desks) {
    solids.push({ x: d.x + 6, y: d.y + 10, w: d.w - 12, h: 30, kind: "desk" });
  }
  solids.push({ x: 12, y: 455, w: 70, h: 48, kind: "shelf" });
  solids.push({ x: 278, y: 455, w: 70, h: 48, kind: "shelf" });

  const cam = { x: 0, y: 0, tx: 0, ty: 0 };

  function charFootW(h) { return Math.max(16, (h * 0.42) | 0); }

  const teacher = {
    x: 160, y: 90,
    drawH: 58, speed: 1.6,
    facing: 0, state: "idle", animDist: 0, vx: 0, vy: 0,
    sprite: "teacher",
  };
  teacher.w = charFootW(teacher.drawH);
  teacher.h = teacher.drawH;

  const students = desks.map((d, i) => {
    const spr = SPRITE_CYCLE[i % SPRITE_CYCLE.length];
    const drawH = 46;
    return {
      x: d.x + 26,
      y: d.y + 8,
      seated: true,
      drawH,
      bob: i * 0.73,
      facing: 3,
      state: "idle",
      animDist: 0,
      sprite: spr,
      w: charFootW(drawH),
      h: drawH,
      deskIndex: i,
      name: STUDENT_NAMES[i],
      present: true,
      handRaise: 0,      /* frames remaining raised */
      handCool: 80 + i * 37,
      blink: 0,          /* frames remaining eyes closed */
      blinkCool: 40 + (i * 29) % 90,
    };
  });

  const cat = {
    x: 168, y: 430,
    homeX: 168, homeY: 430,
    tx: 168, ty: 430,
    w: 28, h: 18, asleep: true, blink: 0, animDist: 0, facing: 2, state: "idle", speed: 0.6,
  };

  const keys = Object.create(null);
  const touchPad = { up: false, down: false, left: false, right: false };
  let isTouchUI = false;
  let startBtn = { x: 0, y: 0, w: 0, h: 0 };
  let closeBtn = { x: 0, y: 0, w: 0, h: 0 };
  let panelBtns = []; /* interactive buttons inside student panel */

  function detectTouchUI() {
    isTouchUI = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0) ||
      window.matchMedia("(pointer: coarse)").matches || window.matchMedia("(max-width: 700px)").matches;
    const dpad = document.getElementById("dpad");
    const actions = document.getElementById("actions");
    const show = isTouchUI && state === STATE.PLAY;
    if (dpad) dpad.classList.toggle("show", show);
    if (actions) actions.classList.toggle("show", show);
    const hint = document.getElementById("rotateHint");
    if (hint) {
      const tall = window.matchMedia("(orientation: portrait) and (max-width: 700px)").matches;
      if (tall && state === STATE.PLAY) {
        hint.style.display = "block";
        clearTimeout(window.__rotateHintTimer);
        window.__rotateHintTimer = setTimeout(() => { hint.style.display = "none"; }, 2800);
      } else {
        hint.style.display = "none";
      }
    }
  }
  detectTouchUI();
  window.addEventListener("resize", detectTouchUI);
  window.addEventListener("orientationchange", detectTouchUI);

  function beginPlay() {
    ensureAudio();
    state = STATE.PLAY;
    detectTouchUI();
    SFX.open();
  }
  if (/[?&]play=1\b/.test(location.search)) {
    setTimeout(beginPlay, 0);
  }

  function presentCount() {
    let n = 0;
    for (const s of students) if (s.present) n++;
    return n;
  }

  function openPanelForZone(z) {
    const pw = Math.min(300, W - 24), ph = 130;
    panel = { kind: "zone", title: z.name, info: z.info, x: (W - pw) / 2, y: H - BAR_H - ph - 100, pw, ph };
    panelBtns = [];
    SFX.open();
  }

  function openStudentPanel(st) {
    const pw = Math.min(312, W - 20), ph = 178;
    panel = {
      kind: "student",
      student: st,
      title: st.name,
      info: "座位 " + (st.deskIndex + 1) + " · 第 " + (Math.floor(st.deskIndex / 4) + 1) + " 行",
      x: (W - pw) / 2,
      y: H - BAR_H - ph - 88,
      pw, ph,
    };
    panelBtns = [];
    highlightZone = -1;
    SFX.interact();
  }

  function findNearestStudent(maxDist) {
    const cx = teacher.x + teacher.w / 2, cy = teacher.y + teacher.h / 2;
    let best = null, bestD = 1e9;
    for (const s of students) {
      const sx = s.x + s.w / 2, sy = s.y + s.h / 2;
      const d = Math.hypot(cx - sx, cy - sy);
      if (d < bestD) { bestD = d; best = s; }
    }
    if (best && bestD <= (maxDist || 58)) return best;
    return null;
  }

  function hitStudentWorld(wx, wy) {
    /* tap near a seated student (generous hit box around desk) */
    for (let i = students.length - 1; i >= 0; i--) {
      const s = students[i];
      const d = desks[s.deskIndex];
      if (wx >= d.x - 4 && wx <= d.x + d.w + 4 && wy >= d.y - 8 && wy <= d.y + d.h + 8) {
        /* also require teacher nearby for roll-call, unless already very close tap */
        const near = findNearestStudent(70);
        if (near === s || Math.hypot((teacher.x + teacher.w / 2) - (s.x + s.w / 2),
            (teacher.y + teacher.h / 2) - (s.y + s.h / 2)) < 80) {
          return s;
        }
      }
    }
    return null;
  }

  function interactNearest() {
    ensureAudio();
    const st = findNearestStudent(62);
    if (st) { openStudentPanel(st); return; }
    const cx = teacher.x + teacher.w / 2, cy = teacher.y + teacher.h / 2;
    let best = null, bestD = 1e9;
    for (const z of zones) {
      const zx = z.x + z.w / 2, zy = z.y + z.h / 2;
      const d = Math.hypot(cx - zx, cy - zy);
      const inside = cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h;
      const score = inside ? d * 0.3 : d;
      if (score < bestD) { bestD = score; best = z; }
    }
    if (best && bestD < 180) { highlightZone = best.id; highlightTimer = 90; openPanelForZone(best); }
  }

  function closePanel() {
    if (panel) SFX.close();
    panel = null;
    highlightZone = -1;
    panelBtns = [];
  }

  function togglePresent(st) {
    st.present = !st.present;
    SFX.toggle();
  }

  function doGreet(st) {
    const msg = GREETINGS[(Math.random() * GREETINGS.length) | 0];
    greetBubble = {
      x: st.x + st.w / 2,
      y: st.y - 4,
      text: msg,
      life: 120,
    };
    SFX.greet();
    /* brief hand raise as acknowledgment */
    st.handRaise = Math.max(st.handRaise, 50);
  }

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (state === STATE.TITLE && (e.code === "Space" || e.code === "Enter")) { beginPlay(); return; }
    if (state !== STATE.PLAY) return;
    if (e.code === "Escape") { closePanel(); return; }
    if (e.code === "KeyE" || e.code === "KeyF") { interactNearest(); return; }
    const numMap = { Digit1: 0, Digit2: 1, Numpad1: 0, Numpad2: 1 };
    if (e.code in numMap) {
      const z = zones[numMap[e.code]];
      if (z) { highlightZone = z.id; highlightTimer = 100; openPanelForZone(z); }
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });

  function canvasPoint(ev) {
    const r = canvas.getBoundingClientRect();
    const sx = W / r.width, sy = H / r.height;
    let cx, cy;
    if (ev.touches && ev.touches.length) { cx = ev.touches[0].clientX; cy = ev.touches[0].clientY; }
    else if (ev.changedTouches && ev.changedTouches.length) { cx = ev.changedTouches[0].clientX; cy = ev.changedTouches[0].clientY; }
    else { cx = ev.clientX; cy = ev.clientY; }
    return { x: (cx - r.left) * sx, y: (cy - r.top) * sy };
  }
  function hitZone(px, py) {
    for (let i = zones.length - 1; i >= 0; i--) {
      const z = zones[i];
      if (px >= z.x && px <= z.x + z.w && py >= z.y && py <= z.y + z.h) return z;
    }
    return null;
  }
  function hitRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
  function screenToWorld(p) { return { x: p.x + cam.x, y: p.y + cam.y }; }

  function handlePointer(p) {
    ensureAudio();
    if (state === STATE.TITLE) { beginPlay(); return; }
    if (panel) {
      if (hitRect(p, closeBtn)) { closePanel(); return; }
      for (const b of panelBtns) {
        if (hitRect(p, b)) { b.fn(); return; }
      }
      const inside = p.x >= panel.x && p.x <= panel.x + panel.pw && p.y >= panel.y && p.y <= panel.y + panel.ph;
      if (!inside) closePanel();
      return;
    }
    const w = screenToWorld(p);
    const st = hitStudentWorld(w.x, w.y);
    if (st) { openStudentPanel(st); return; }
    const z = hitZone(w.x, w.y);
    if (z) { highlightZone = z.id; highlightTimer = 70; openPanelForZone(z); }
  }
  canvas.addEventListener("click", (e) => handlePointer(canvasPoint(e)));
  canvas.addEventListener("touchend", (e) => {
    if (!e.changedTouches || !e.changedTouches.length) return;
    e.preventDefault(); handlePointer(canvasPoint(e));
  }, { passive: false });

  let hoverZone = null;
  canvas.addEventListener("mousemove", (e) => {
    if (state !== STATE.PLAY) return;
    const w = screenToWorld(canvasPoint(e));
    hoverZone = hitZone(w.x, w.y);
  });

  (function setupDpad() {
    const dpad = document.getElementById("dpad");
    if (!dpad) return;
    function setDir(dir, on) {
      touchPad[dir] = on;
      const el = dpad.querySelector("[data-dir=" + dir + "]");
      if (el) el.classList.toggle("active", on);
      if (on) ensureAudio();
    }
    dpad.querySelectorAll(".btn[data-dir]").forEach((el) => {
      const dir = el.getAttribute("data-dir");
      const on = (ev) => { ev.preventDefault(); ev.stopPropagation(); setDir(dir, true); };
      const off = (ev) => { ev.preventDefault(); ev.stopPropagation(); setDir(dir, false); };
      el.addEventListener("touchstart", on, { passive: false });
      el.addEventListener("touchend", off, { passive: false });
      el.addEventListener("touchcancel", off, { passive: false });
      el.addEventListener("mousedown", on);
      window.addEventListener("mouseup", () => setDir(dir, false));
    });
  })();

  (function setupActions() {
    function press(el, fn) {
      if (!el) return;
      const go = (ev) => { ev.preventDefault(); ev.stopPropagation(); el.classList.add("active"); fn(); setTimeout(() => el.classList.remove("active"), 120); };
      el.addEventListener("touchstart", go, { passive: false });
      el.addEventListener("click", go);
    }
    press(document.getElementById("btnAct"), () => {
      if (state !== STATE.PLAY) return;
      if (panel) { closePanel(); return; }
      interactNearest();
    });
    press(document.getElementById("btnClose"), () => { closePanel(); });
  })();

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function solidHitbox(s) {
    return { x: s.x + 3, y: s.y + Math.max(0, s.h - 14), w: s.w - 6, h: Math.min(16, s.h) };
  }
  function actorHitbox(a) {
    const fw = Math.max(10, a.w * 0.7), fh = Math.max(6, a.h * 0.18);
    return { x: a.x + (a.w - fw) / 2, y: a.y + a.h - fh, w: fw, h: fh };
  }
  function collidesAt(a, nx, ny) {
    const foot = actorHitbox({ x: nx, y: ny, w: a.w, h: a.h });
    if (foot.x < ROOM.x + 6 || foot.x + foot.w > ROOM.x + ROOM.w - 6) return true;
    if (foot.y < ROOM.y + 56 || foot.y + foot.h > ROOM.y + ROOM.h - 6) return true;
    for (const s of solids) {
      if (rectsOverlap(foot, solidHitbox(s))) return true;
    }
    return false;
  }
  function moveActor(a, dx, dy) {
    let moved = false;
    if (dx !== 0 && !collidesAt(a, a.x + dx, a.y)) { a.x += dx; moved = true; }
    if (dy !== 0 && !collidesAt(a, a.x, a.y + dy)) { a.y += dy; moved = true; }
    return moved;
  }

  function updateTeacher() {
    let dx = 0, dy = 0;
    if (keys["ArrowLeft"] || keys["KeyA"] || touchPad.left) dx -= 1;
    if (keys["ArrowRight"] || keys["KeyD"] || touchPad.right) dx += 1;
    if (keys["ArrowUp"] || keys["KeyW"] || touchPad.up) dy -= 1;
    if (keys["ArrowDown"] || keys["KeyS"] || touchPad.down) dy += 1;
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    teacher.vx = dx * teacher.speed; teacher.vy = dy * teacher.speed;
    if (dx || dy) {
      if (Math.abs(dx) > Math.abs(dy)) teacher.facing = dx < 0 ? 1 : 2;
      else teacher.facing = dy < 0 ? 3 : 0;
    }
    const moved = moveActor(teacher, teacher.vx, teacher.vy);
    if (moved && (dx || dy)) {
      teacher.state = "walk";
      teacher.animDist += Math.hypot(teacher.vx, teacher.vy);
      SFX.walk();
    } else teacher.state = "idle";
    nearestStudent = findNearestStudent(62);
  }

  function updateStudents() {
    for (const s of students) {
      /* idle bob phase advances in draw via frame + bob */
      if (s.handRaise > 0) s.handRaise--;
      else {
        s.handCool--;
        if (s.handCool <= 0 && s.present && Math.random() < 0.35) {
          s.handRaise = 70 + ((Math.random() * 50) | 0);
          s.handCool = 180 + ((Math.random() * 220) | 0);
        } else if (s.handCool <= 0) {
          s.handCool = 100 + ((Math.random() * 160) | 0);
        }
      }
      if (s.blink > 0) s.blink--;
      else {
        s.blinkCool--;
        if (s.blinkCool <= 0) {
          s.blink = 5 + ((Math.random() * 4) | 0);
          s.blinkCool = 70 + ((Math.random() * 140) | 0);
        }
      }
    }
    if (greetBubble) {
      greetBubble.life--;
      if (greetBubble.life <= 0) greetBubble = null;
    }
  }

  function updateCat() {
    cat.blink++;
    if (cat.asleep) {
      if (cat.blink > 200 && Math.random() < 0.012) {
        cat.asleep = false;
        cat.tx = cat.homeX + (Math.random() * 60 - 30);
        cat.ty = cat.homeY + (Math.random() * 24 - 8);
        cat.state = "walk";
      }
      return;
    }
    const dx = cat.tx - cat.x, dy = cat.ty - cat.y, dist = Math.hypot(dx, dy);
    if (dist < 2) {
      cat.state = "idle";
      if (Math.random() < 0.02) cat.asleep = true;
      else if (Math.random() < 0.03) {
        cat.tx = cat.homeX + (Math.random() * 70 - 35);
        cat.ty = cat.homeY + (Math.random() * 30 - 10);
      }
      return;
    }
    cat.facing = dx < 0 ? 1 : 2;
    cat.x += (dx / dist) * cat.speed; cat.y += (dy / dist) * cat.speed;
    cat.animDist += cat.speed; cat.state = "walk";
  }

  function updateCamera() {
    cam.tx = teacher.x + teacher.w / 2 + teacher.vx * 14 - W / 2;
    cam.ty = teacher.y + teacher.h / 2 + teacher.vy * 14 - H / 2;
    const maxX = Math.max(0, ROOM.x + ROOM.w - W);
    const maxY = Math.max(0, ROOM.y + ROOM.h + BAR_H - H + 8);
    cam.tx = Math.max(0, Math.min(maxX, cam.tx));
    cam.ty = Math.max(0, Math.min(maxY, cam.ty));
    cam.x += (cam.tx - cam.x) * 0.12;
    cam.y += (cam.ty - cam.y) * 0.12;
  }

  function walkFrame(a) {
    if (a.state !== "walk") return 0;
    return ((a.animDist / 10) | 0) % 4;
  }

  function drawChar(actor, yBob) {
    const facing = actor.facing | 0;
    const af = actor.seated ? 0 : walkFrame(actor);
    /* hand raise: briefly use a side-facing walk frame as a gesture if seated */
    let name;
    if (actor.seated && actor.handRaise > 0) {
      name = actor.sprite + "_2_1";
      if (!SPR[name]) name = actor.sprite + "_sit";
    } else {
      name = actor.seated ? (actor.sprite + "_sit") : (actor.sprite + "_" + facing + "_" + af);
    }
    const s = SPR[name] || SPR[actor.sprite + "_0_0"] || SPR[actor.sprite + "_sit"];
    if (!s) return;
    const dh = actor.drawH || 48;
    const raiseLift = (actor.seated && actor.handRaise > 0) ? -3 : 0;
    const dw = (s.w * (dh / s.h) + 0.5) | 0;
    const dx = actor.x + (actor.w - dw) / 2;
    const dy = actor.y + (yBob || 0) + raiseLift - (dh - actor.h);
    /* ground shadow under feet */
    drawShadow(dx + dw / 2, dy + dh - 2, dw * 0.42, Math.max(3, dh * 0.08), actor.seated ? 0.32 : 0.40);
    blitSized(name, dx, dy, dw, dh, false);

    /* blink overlay — thin dark line over approximate eye band */
    if (actor.blink > 0 && actor.seated) {
      const eyeY = dy + dh * 0.28;
      const eyeW = dw * 0.42;
      const eyeX = dx + (dw - eyeW) / 2;
      ctx.fillStyle = "rgba(20,16,28,0.85)";
      ctx.fillRect((eyeX + 0.5) | 0, (eyeY + 0.5) | 0, (eyeW + 0.5) | 0, 2);
    }

    /* raised-hand pixel flag above head */
    if (actor.handRaise > 0 && actor.seated) {
      const hx = dx + dw * 0.72;
      const hy = dy - 2;
      ctx.fillStyle = "#f0c14b";
      ctx.fillRect((hx) | 0, (hy - 10) | 0, 4, 10);
      ctx.fillRect((hx - 2) | 0, (hy - 12) | 0, 8, 4);
      ctx.fillStyle = "#ffe08a";
      ctx.fillRect((hx) | 0, (hy - 14) | 0, 4, 3);
    }

    /* absent tint */
    if (actor.seated && actor.present === false) {
      ctx.fillStyle = "rgba(40,20,30,0.45)";
      ctx.fillRect((dx) | 0, (dy) | 0, dw, dh);
    }
  }

  function drawFloor() {
    const x0 = ROOM.x, y0 = ROOM.y, w = ROOM.w, h = ROOM.h;
    ctx.fillStyle = C.sky;
    ctx.fillRect(x0, y0, w, 22);
    ctx.fillStyle = C.skyCloud;
    for (let i = 0; i < 5; i++) {
      const cx = x0 + 28 + i * 68 + ((frame / 40) | 0) % 3;
      ctx.fillRect(cx, y0 + 6, 18, 6);
      ctx.fillRect(cx + 4, y0 + 3, 10, 4);
    }
    ctx.fillStyle = C.wall;
    ctx.fillRect(x0, y0 + 20, w, 42);
    ctx.fillStyle = C.wallLine;
    for (let y = y0 + 26; y < y0 + 58; y += 7) ctx.fillRect(x0, y, w, 1);
    ctx.fillStyle = C.wallBase;
    ctx.fillRect(x0, y0 + 58, w, 4);
    ctx.fillStyle = C.floorA;
    ctx.fillRect(x0, y0 + 62, w, h - 62);
    const plankH = 10;
    for (let y = y0 + 62, row = 0; y < y0 + h; y += plankH, row++) {

      ctx.fillRect(x0, y, w, 2);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(30,70,140,0.35)";
      ctx.fillRect(x0, y + plankH - 1, w, 1);
    }
  }

  function drawDesk(d) {

  function drawActors() {
    const list = [];
    for (const s of students) list.push({ kind: "s", ref: s, y: s.y + s.h });
    list.push({ kind: "t", ref: teacher, y: teacher.y + teacher.h });
    list.push({ kind: "c", ref: cat, y: cat.y + cat.h });
    list.sort((a, b) => a.y - b.y);
    for (const item of list) {
      if (item.kind === "c") {
        const nm = cat.facing === 1 ? "cat_flip" : "cat";
        drawShadow(cat.x + cat.w / 2, cat.y + cat.h - 1, cat.w * 0.45, 4, 0.30);
        if (SPR[nm]) blitSized(nm, cat.x, cat.y + (cat.asleep ? 1 : 0), cat.w, cat.h);
        else if (SPR.cat) blitSized("cat", cat.x, cat.y, cat.w, cat.h);
        continue;
      }
      /* stronger idle bob for seated students */
      const bob = item.ref.seated
        ? Math.sin(frame * 0.07 + (item.ref.bob || 0)) * 1.35

      drawChar(item.ref, bob);

      /* proximity prompt */

  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function wrapText(text, x, y, maxW, lineH) {
    let line = "";
    for (const ch of text.split("")) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, y); line = ch; y += lineH; }
      else line = test;
    }
    if (line) ctx.fillText(line, x, y);
  }

  function drawTitle() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

    ctx.translate(0, 40);
    drawFloor();
    drawFrontWallProps();
    for (const d of desks) drawDesk(d);

    ctx.restore();
    ctx.fillStyle = "rgba(10,14,22,0.62)";
    ctx.fillRect(0, 0, W, 130);
    ctx.fillRect(0, H - 150, W, 150);
    ctx.fillStyle = C.titleGold;
    ctx.font = "bold 28px PingFang HK, Noto Sans TC, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("像素課室", W / 2, 58);
    ctx.fillStyle = C.titleCream;
    ctx.font = "14px PingFang HK, Noto Sans TC, sans-serif";
    ctx.fillText("上課，像玩遊戲一樣", W / 2, 86);
    ctx.fillStyle = C.uiDim;
    ctx.font = "12px PingFang HK, Noto Sans TC, sans-serif";
    ctx.fillText("大角色 · 點名 · 音效 · 16 同學", W / 2, 110);
    startBtn = { x: W / 2 - 90, y: H - 100, w: 180, h: 52 };
    ctx.fillStyle = C.uiAccent;
    roundRect(startBtn.x, startBtn.y, startBtn.w, startBtn.h, 14); ctx.fill();
    ctx.fillStyle = "#1a2030";
    ctx.font = "bold 18px PingFang HK, Noto Sans TC, sans-serif";
    ctx.fillText("開始上課", W / 2, startBtn.y + 34);
  }

  function tick() {
    frame++;
    if (walkCool > 0) walkCool--;
    if (highlightTimer > 0) highlightTimer--;
    else if (!panel) highlightZone = -1;
    if (state === STATE.PLAY) {
      updateTeacher(); updateStudents(); updateCat(); updateCamera();
    }
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    if (state === STATE.TITLE) drawTitle();
    else {
      ctx.save();
      ctx.translate((-cam.x + 0.5) | 0, (-cam.y + 0.5) | 0);
      drawWorld(); drawActors();
      ctx.restore();
      drawUI();
    }
    requestAnimationFrame(tick);
  }

  Promise.all([
    fetch("assets/atlas.json").then(r => r.json()),
    new Promise((resolve, reject) => { atlas.onload = resolve; atlas.onerror = reject; atlas.src = "assets/atlas.png"; })
  ]).then(([json]) => { SPR = json; atlasReady = true; tick(); })
    .catch((err) => {
      console.error(err);
      ctx.fillStyle = "#200"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff"; ctx.font = "14px monospace";
      ctx.fillText("Failed to load assets/", 20, 40);
    });
})();
</script>
</body>
</html>
