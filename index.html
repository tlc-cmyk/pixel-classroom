<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>像素課室 · 中四 ICT · Lap Cheung Tsao</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100svh;
    height: 100dvh;
    background: #0e0906;
    overflow: hidden;
    font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", "Courier New", monospace;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100svh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    background: #120c08;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
    background: #120c08;
    cursor: crosshair;
  }
  #dpad {
    display: none;
    position: absolute;
    left: max(10px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 176px;
    height: 176px;
    z-index: 8;
    user-select: none;
    touch-action: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55));
  }
  #dpad.show { display: block; }
  #dpad .btn {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(70,46,28,0.92), rgba(40,26,16,0.92));
    border: 3px solid #d4a86a;
    box-shadow: inset 0 1px 0 rgba(255,240,200,0.25), inset 0 -2px 0 rgba(0,0,0,0.35);
    color: #fff8ee;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  #dpad .btn.active {
    background: linear-gradient(180deg, rgba(240,193,75,0.75), rgba(180,120,40,0.85));
    border-color: #ffe08a;
    transform: scale(0.96);
  }
  #dpad .up { left: 60px; top: 0; }
  #dpad .down { left: 60px; bottom: 0; }
  #dpad .left { left: 0; top: 60px; }
  #dpad .right { right: 0; top: 60px; }
  #dpad .center {
    left: 60px; top: 60px; width: 56px; height: 56px;
    border-radius: 50%; opacity: 0.4; pointer-events: none;
    font-size: 12px; border-style: dashed;
  }
  #actions {
    display: none;
    position: absolute;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    z-index: 8;
    user-select: none;
    touch-action: none;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
  }
  #actions.show { display: flex; }
  #actions .abtn {
    min-width: 72px;
    height: 72px;
    padding: 0 14px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(70,46,28,0.94), rgba(36,24,14,0.94));
    border: 3px solid #d4a86a;
    box-shadow: inset 0 1px 0 rgba(255,240,200,0.22), 0 4px 12px rgba(0,0,0,0.45);
    color: #fff8ee;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    line-height: 1.1;
  }
  #actions .abtn .ico { font-size: 22px; line-height: 1; }
  #actions .abtn.active, #actions .abtn:active {
    background: linear-gradient(180deg, rgba(240,193,75,0.8), rgba(160,100,30,0.9));
    border-color: #ffe08a;
  }
  #actions .abtn.close {
    min-width: 64px; height: 64px;
    border-color: #c87858;
    background: linear-gradient(180deg, rgba(90,40,28,0.94), rgba(50,22,16,0.94));
  }
  #rotateHint {
    display: none;
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
    z-index: 12;
    background: rgba(26,32,48,0.92);
    color: #f0c14b;
    border: 2px solid #c49a6c;
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    pointer-events: none;
    white-space: nowrap;
  }
  @media (min-width: 700px) and (hover: hover) and (pointer: fine) {
    html, body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1008;
      position: static;
    }
    #wrap {
      position: relative;
      width: min(420px, 42vw);
      height: min(746px, 94dvh);
      inset: auto;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 0 0 3px #5c3a22,
        0 0 0 5px #c49a6c,
        0 20px 60px rgba(0,0,0,0.65);
    }
  }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="360" height="640"></canvas>
<div id="rotateHint">橫放手機可睇更清楚課桌</div>
<div id="dpad" aria-hidden="true">
  <div class="btn up" data-dir="up">▲</div>
  <div class="btn left" data-dir="left">◀</div>
  <div class="btn center">+</div>
  <div class="btn right" data-dir="right">▶</div>
  <div class="btn down" data-dir="down">▼</div>
</div>
<div id="actions" aria-hidden="true">
  <button type="button" class="abtn close" id="btnClose" title="關閉"><span class="ico">✕</span><span>關閉</span></button>
  <button type="button" class="abtn" id="btnAct" title="互動"><span class="ico">✦</span><span>互動</span></button>
</div>
</div>
<script>
(function () {
  "use strict";
  const W = 360, H = 640;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  let SPR = {};
  const atlas = new Image();
  let atlasReady = false;

  function blitSized(name, dx, dy, dw, dh, flipX) {
    const s = SPR[name];
    if (!s || !atlasReady) return;
    const x = (dx + 0.5) | 0, y = (dy + 0.5) | 0;
    const w = (dw + 0.5) | 0, h = (dh + 0.5) | 0;
    if (flipX) {
      ctx.save();
      ctx.translate(x + w, y);
      ctx.scale(-1, 1);
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, 0, 0, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, x, y, w, h);
    }
  }
  function blitTiled(name, dx, dy, dw, dh) {
    const s = SPR[name];
    if (!s || !atlasReady) return;
    const x0 = (dx + 0.5) | 0, y0 = (dy + 0.5) | 0;
    const x1 = x0 + ((dw + 0.5) | 0), y1 = y0 + ((dh + 0.5) | 0);
    for (let y = y0; y < y1; y += s.h) {
      for (let x = x0; x < x1; x += s.w) {
        const tw = Math.min(s.w, x1 - x);
        const th = Math.min(s.h, y1 - y);
        ctx.drawImage(atlas, s.x, s.y, tw, th, x, y, tw, th);
      }
    }
  }

  const C = {
    bg: "#121820",
    sky: "#4aa0e8",
    skyCloud: "#f4f8ff",
    wall: "#f2f0ea",
    wallLine: "#d0ccc4",
    wallBase: "#e8c86a",
    floorA: "#41a6f6",
    floorB: "#3590dc",
    floorHi: "#73eff7",
    ui: "#f4f7ff", uiDim: "#90a0b8",
    uiPanel: "#1a2438", uiPanelMid: "#243048", uiPanelBorder: "#8aa0c0",
    uiAccent: "#f0c14b",
    titleGold: "#f0c14b", titleCream: "#f4f7ff",
    highlight: "rgba(240,193,75,0.28)",
    zoneTint1: "rgba(46,120,90,0.12)",
    zoneTint2: "rgba(50,110,180,0.10)",
    zoneLabel: "#1a2438",
    overlay: "rgba(10,14,22,0.88)",
  };

  const STATE = { TITLE: 0, PLAY: 1 };
  let state = STATE.TITLE;
  let frame = 0;
  let panel = null;
  let highlightZone = -1;
  let highlightTimer = 0;

  const BAR_H = 52;
  const TOP_H = 28;

  /* Classroom world — portrait 360 wide, scrollable height */
  const ROOM = { x: 0, y: TOP_H, w: 360, h: 470 };

  /* 4×4 desk grid with center aisle */
  const DESK_W = 68, DESK_H = 52;
  const COL_X = [18, 92, 200, 274];
  const ROW_Y = [128, 192, 256, 320];
  const SPRITE_CYCLE = ["student0", "student1", "student4", "student2", "student3", "student5"];
  const CHAIR_CYCLE = ["chair0", "chair1", "chair2", "chair3", "chair4", "chair5"];

  const desks = [];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const i = r * 4 + c;
      desks.push({
        i, r, c,
        x: COL_X[c],
        y: ROW_Y[r],
        w: DESK_W,
        h: DESK_H,
        chair: CHAIR_CYCLE[i % CHAIR_CYCLE.length],
        table: "table0",
      });
    }
  }

  const teacherDesk = { x: 130, y: 78, w: 100, h: 36 };

  const zones = [
    {
      id: 0, name: "講台", key: "1",
      x: 40, y: TOP_H + 4, w: 280, h: 88,
      info: "白板講解 · 今日課題：數據庫基礎（SELECT／WHERE）· 老師可喺度行嚟行去",
      color: C.zoneTint1,
    },
    {
      id: 1, name: "課室座位", key: "2",
      x: 10, y: 120, w: 340, h: 270,
      info: "4×4 座位 · 16 位同學 · 請沿走道巡堂，唔好撞到書枱",
      color: C.zoneTint2,
    },
  ];

  const solids = [];
  /* Front props */
  solids.push({ x: 8, y: TOP_H + 36, w: 36, h: 40, kind: "prop" });       /* plant / window ledge L */
  solids.push({ x: 316, y: TOP_H + 36, w: 36, h: 40, kind: "prop" });      /* plant R */
  solids.push({ x: teacherDesk.x, y: teacherDesk.y, w: teacherDesk.w, h: teacherDesk.h, kind: "desk" });
  /* 16 student desks — collide with desk body (not full chair) */
  for (const d of desks) {
    solids.push({ x: d.x + 4, y: d.y + 4, w: d.w - 8, h: 26, kind: "desk" });
  }
  /* Back shelf strip */
  solids.push({ x: 12, y: 400, w: 70, h: 48, kind: "shelf" });
  solids.push({ x: 278, y: 400, w: 70, h: 48, kind: "shelf" });

  const cam = { x: 0, y: 0, tx: 0, ty: 0 };

  function charFootW(h) { return Math.max(14, (h * 0.42) | 0); }

  const teacher = {
    x: 168, y: 95,
    drawH: 44, speed: 1.55,
    facing: 0, state: "idle", animDist: 0, vx: 0, vy: 0,
    sprite: "teacher",
  };
  teacher.w = charFootW(teacher.drawH);
  teacher.h = teacher.drawH;

  const students = desks.map((d, i) => {
    const spr = SPRITE_CYCLE[i % SPRITE_CYCLE.length];
    const drawH = 32;
    return {
      x: d.x + 20,
      y: d.y + 12,
      seated: true,
      drawH,
      bob: i * 0.37,
      facing: 3, /* face board (up) */
      state: "idle",
      animDist: 0,
      sprite: spr,
      w: charFootW(drawH),
      h: drawH,
      deskIndex: i,
    };
  });

  const cat = {
    x: 170, y: 380,
    homeX: 170, homeY: 380,
    tx: 170, ty: 380,
    w: 24, h: 16, asleep: true, blink: 0, animDist: 0, facing: 2, state: "idle", speed: 0.6,
  };

  const keys = Object.create(null);
  const touchPad = { up: false, down: false, left: false, right: false };
  let isTouchUI = false;
  let startBtn = { x: 0, y: 0, w: 0, h: 0 };
  let closeBtn = { x: 0, y: 0, w: 0, h: 0 };

  function detectTouchUI() {
    isTouchUI = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0) ||
      window.matchMedia("(pointer: coarse)").matches || window.matchMedia("(max-width: 700px)").matches;
    const dpad = document.getElementById("dpad");
    const actions = document.getElementById("actions");
    const show = isTouchUI && state === STATE.PLAY;
    if (dpad) dpad.classList.toggle("show", show);
    if (actions) actions.classList.toggle("show", show);
    const hint = document.getElementById("rotateHint");
    if (hint) {
      const tall = window.matchMedia("(orientation: portrait) and (max-width: 700px)").matches;
      if (tall && state === STATE.PLAY) {
        hint.style.display = "block";
        clearTimeout(window.__rotateHintTimer);
        window.__rotateHintTimer = setTimeout(() => { hint.style.display = "none"; }, 3500);
      } else {
        hint.style.display = "none";
      }
    }
  }
  detectTouchUI();
  window.addEventListener("resize", detectTouchUI);
  window.addEventListener("orientationchange", detectTouchUI);

  function beginPlay() { state = STATE.PLAY; detectTouchUI(); }
  // Auto-start for preview / deep-link
  if (/[?&]play=1\b/.test(location.search)) {
    setTimeout(beginPlay, 0);
  }


  function openPanelForZone(z) {
    const pw = Math.min(300, W - 24), ph = 130;
    panel = { title: z.name, info: z.info, x: (W - pw) / 2, y: H - BAR_H - ph - 100, pw, ph };
  }
  function interactNearest() {
    const cx = teacher.x + teacher.w / 2, cy = teacher.y + teacher.h / 2;
    let best = null, bestD = 1e9;
    for (const z of zones) {
      const zx = z.x + z.w / 2, zy = z.y + z.h / 2;
      const d = Math.hypot(cx - zx, cy - zy);
      const inside = cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h;
      const score = inside ? d * 0.3 : d;
      if (score < bestD) { bestD = score; best = z; }
    }
    if (best && bestD < 180) { highlightZone = best.id; highlightTimer = 90; openPanelForZone(best); }
  }

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (state === STATE.TITLE && (e.code === "Space" || e.code === "Enter")) { beginPlay(); return; }
    if (state !== STATE.PLAY) return;
    if (e.code === "Escape") { panel = null; highlightZone = -1; return; }
    if (e.code === "KeyE" || e.code === "KeyF") { interactNearest(); return; }
    const numMap = { Digit1: 0, Digit2: 1, Numpad1: 0, Numpad2: 1 };
    if (e.code in numMap) {
      const z = zones[numMap[e.code]];
      if (z) { highlightZone = z.id; highlightTimer = 100; openPanelForZone(z); }
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });

  function canvasPoint(ev) {
    const r = canvas.getBoundingClientRect();
    const sx = W / r.width, sy = H / r.height;
    let cx, cy;
    if (ev.touches && ev.touches.length) { cx = ev.touches[0].clientX; cy = ev.touches[0].clientY; }
    else if (ev.changedTouches && ev.changedTouches.length) { cx = ev.changedTouches[0].clientX; cy = ev.changedTouches[0].clientY; }
    else { cx = ev.clientX; cy = ev.clientY; }
    return { x: (cx - r.left) * sx, y: (cy - r.top) * sy };
  }
  function hitZone(px, py) {
    for (let i = zones.length - 1; i >= 0; i--) {
      const z = zones[i];
      if (px >= z.x && px <= z.x + z.w && py >= z.y && py <= z.y + z.h) return z;
    }
    return null;
  }
  function hitRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
  function screenToWorld(p) { return { x: p.x + cam.x, y: p.y + cam.y }; }

  function handlePointer(p) {
    if (state === STATE.TITLE) { beginPlay(); return; }
    if (panel) {
      if (hitRect(p, closeBtn)) { panel = null; highlightZone = -1; return; }
      const inside = p.x >= panel.x && p.x <= panel.x + panel.pw && p.y >= panel.y && p.y <= panel.y + panel.ph;
      if (!inside) { panel = null; highlightZone = -1; }
      return;
    }
    const w = screenToWorld(p);
    const z = hitZone(w.x, w.y);
    if (z) { highlightZone = z.id; highlightTimer = 70; openPanelForZone(z); }
  }
  canvas.addEventListener("click", (e) => handlePointer(canvasPoint(e)));
  canvas.addEventListener("touchend", (e) => {
    if (!e.changedTouches || !e.changedTouches.length) return;
    e.preventDefault(); handlePointer(canvasPoint(e));
  }, { passive: false });

  let hoverZone = null;
  canvas.addEventListener("mousemove", (e) => {
    if (state !== STATE.PLAY) return;
    const w = screenToWorld(canvasPoint(e));
    hoverZone = hitZone(w.x, w.y);
  });

  (function setupDpad() {
    const dpad = document.getElementById("dpad");
    if (!dpad) return;
    function setDir(dir, on) {
      touchPad[dir] = on;
      const el = dpad.querySelector("[data-dir=" + dir + "]");
      if (el) el.classList.toggle("active", on);
    }
    dpad.querySelectorAll(".btn[data-dir]").forEach((el) => {
      const dir = el.getAttribute("data-dir");
      const on = (ev) => { ev.preventDefault(); ev.stopPropagation(); setDir(dir, true); };
      const off = (ev) => { ev.preventDefault(); ev.stopPropagation(); setDir(dir, false); };
      el.addEventListener("touchstart", on, { passive: false });
      el.addEventListener("touchend", off, { passive: false });
      el.addEventListener("touchcancel", off, { passive: false });
      el.addEventListener("mousedown", on);
      window.addEventListener("mouseup", () => setDir(dir, false));
    });
  })();

  (function setupActions() {
    function press(el, fn) {
      if (!el) return;
      const go = (ev) => { ev.preventDefault(); ev.stopPropagation(); el.classList.add("active"); fn(); setTimeout(() => el.classList.remove("active"), 120); };
      el.addEventListener("touchstart", go, { passive: false });
      el.addEventListener("click", go);
    }
    press(document.getElementById("btnAct"), () => {
      if (state !== STATE.PLAY) return;
      if (panel) { panel = null; highlightZone = -1; return; }
      interactNearest();
    });
    press(document.getElementById("btnClose"), () => { panel = null; highlightZone = -1; });
  })();

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function solidHitbox(s) {
    return { x: s.x + 3, y: s.y + Math.max(0, s.h - 14), w: s.w - 6, h: Math.min(16, s.h) };
  }
  function actorHitbox(a) {
    const fw = Math.max(10, a.w * 0.7), fh = Math.max(6, a.h * 0.18);
    return { x: a.x + (a.w - fw) / 2, y: a.y + a.h - fh, w: fw, h: fh };
  }
  function collidesAt(a, nx, ny) {
    const foot = actorHitbox({ x: nx, y: ny, w: a.w, h: a.h });
    if (foot.x < ROOM.x + 6 || foot.x + foot.w > ROOM.x + ROOM.w - 6) return true;
    if (foot.y < ROOM.y + 56 || foot.y + foot.h > ROOM.y + ROOM.h - 6) return true;
    for (const s of solids) {
      if (rectsOverlap(foot, solidHitbox(s))) return true;
    }
    return false;
  }
  function moveActor(a, dx, dy) {
    let moved = false;
    if (dx !== 0 && !collidesAt(a, a.x + dx, a.y)) { a.x += dx; moved = true; }
    if (dy !== 0 && !collidesAt(a, a.x, a.y + dy)) { a.y += dy; moved = true; }
    return moved;
  }

  function updateTeacher() {
    let dx = 0, dy = 0;
    if (keys["ArrowLeft"] || keys["KeyA"] || touchPad.left) dx -= 1;
    if (keys["ArrowRight"] || keys["KeyD"] || touchPad.right) dx += 1;
    if (keys["ArrowUp"] || keys["KeyW"] || touchPad.up) dy -= 1;
    if (keys["ArrowDown"] || keys["KeyS"] || touchPad.down) dy += 1;
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    teacher.vx = dx * teacher.speed; teacher.vy = dy * teacher.speed;
    if (dx || dy) {
      if (Math.abs(dx) > Math.abs(dy)) teacher.facing = dx < 0 ? 1 : 2;
      else teacher.facing = dy < 0 ? 3 : 0;
    }
    const moved = moveActor(teacher, teacher.vx, teacher.vy);
    if (moved && (dx || dy)) { teacher.state = "walk"; teacher.animDist += Math.hypot(teacher.vx, teacher.vy); }
    else teacher.state = "idle";
  }

  function updateCat() {
    cat.blink++;
    if (cat.asleep) {
      if (cat.blink > 200 && Math.random() < 0.012) {
        cat.asleep = false;
        cat.tx = cat.homeX + (Math.random() * 60 - 30);
        cat.ty = cat.homeY + (Math.random() * 24 - 8);
        cat.state = "walk";
      }
      return;
    }
    const dx = cat.tx - cat.x, dy = cat.ty - cat.y, dist = Math.hypot(dx, dy);
    if (dist < 2) {
      cat.state = "idle";
      if (Math.random() < 0.02) cat.asleep = true;
      else if (Math.random() < 0.03) {
        cat.tx = cat.homeX + (Math.random() * 70 - 35);
        cat.ty = cat.homeY + (Math.random() * 30 - 10);
      }
      return;
    }
    cat.facing = dx < 0 ? 1 : 2;
    cat.x += (dx / dist) * cat.speed; cat.y += (dy / dist) * cat.speed;
    cat.animDist += cat.speed; cat.state = "walk";
  }

  function updateCamera() {
    cam.tx = teacher.x + teacher.w / 2 + teacher.vx * 14 - W / 2;
    cam.ty = teacher.y + teacher.h / 2 + teacher.vy * 14 - H / 2;
    const maxX = Math.max(0, ROOM.x + ROOM.w - W);
    const maxY = Math.max(0, ROOM.y + ROOM.h + BAR_H - H + 8);
    cam.tx = Math.max(0, Math.min(maxX, cam.tx));
    cam.ty = Math.max(0, Math.min(maxY, cam.ty));
    cam.x += (cam.tx - cam.x) * 0.12;
    cam.y += (cam.ty - cam.y) * 0.12;
  }

  function walkFrame(a) {
    if (a.state !== "walk") return 0;
    return ((a.animDist / 10) | 0) % 4;
  }

  function drawChar(actor, yBob) {
    const facing = actor.facing | 0;
    const af = actor.seated ? 0 : walkFrame(actor);
    const name = actor.seated ? (actor.sprite + "_sit") : (actor.sprite + "_" + facing + "_" + af);
    const s = SPR[name] || SPR[actor.sprite + "_0_0"] || SPR[actor.sprite + "_sit"];
    if (!s) return;
    const dh = actor.drawH || 48;
    const dw = (s.w * (dh / s.h) + 0.5) | 0;
    blitSized(name, actor.x + (actor.w - dw) / 2, actor.y + (yBob || 0) - (dh - actor.h), dw, dh, false);
  }

  function drawFloor() {
    const x0 = ROOM.x, y0 = ROOM.y, w = ROOM.w, h = ROOM.h;
    /* sky strip above wall */
    ctx.fillStyle = C.sky;
    ctx.fillRect(x0, y0, w, 22);
    ctx.fillStyle = C.skyCloud;
    for (let i = 0; i < 5; i++) {
      const cx = x0 + 28 + i * 68 + ((frame / 40) | 0) % 3;
      ctx.fillRect(cx, y0 + 6, 18, 6);
      ctx.fillRect(cx + 4, y0 + 3, 10, 4);
    }
    /* wall */
    ctx.fillStyle = C.wall;
    ctx.fillRect(x0, y0 + 20, w, 42);
    ctx.fillStyle = C.wallLine;
    for (let y = y0 + 26; y < y0 + 58; y += 7) ctx.fillRect(x0, y, w, 1);
    ctx.fillStyle = C.wallBase;
    ctx.fillRect(x0, y0 + 58, w, 4);
    /* blue plank floor (Pixel Office style) */
    ctx.fillStyle = C.floorA;
    ctx.fillRect(x0, y0 + 62, w, h - 62);
    const plankH = 10;
    for (let y = y0 + 62, row = 0; y < y0 + h; y += plankH, row++) {
      ctx.fillStyle = (row % 2 === 0) ? C.floorHi : C.floorB;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(x0, y, w, 2);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(30,70,140,0.35)";
      ctx.fillRect(x0, y + plankH - 1, w, 1);
    }
  }

  function drawFrontWallProps() {
    /* windows */
    if (SPR.window0) blitSized("window0", 48, ROOM.y + 22, 42, 40);
    if (SPR.window1) blitSized("window1", 270, ROOM.y + 22, 42, 40);
    /* whiteboard */
    if (SPR.board) blitSized("board", 100, ROOM.y + 24, 160, 40);
    else {
      ctx.fillStyle = "#e8eef8";
      ctx.fillRect(100, ROOM.y + 24, 160, 40);
      ctx.strokeStyle = "#8aa0c0";
      ctx.strokeRect(100, ROOM.y + 24, 160, 40);
    }
    /* chalk text */
    ctx.fillStyle = "#c04040";
    ctx.font = "bold 11px PingFang HK, Noto Sans TC, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("中四 ICT · SELECT", 180, ROOM.y + 48);
    /* door */
    if (SPR.door) blitSized("door", 8, ROOM.y + 28, 32, 48);
    /* plants */
    if (SPR.plant) {
      blitSized("plant", 318, ROOM.y + 30, 28, 36);
      blitSized("plant", 70, ROOM.y + 34, 24, 30);
    } else if (SPR.kplant0) {
      blitSized("kplant0", 320, ROOM.y + 28, 24, 40);
    }
    /* teacher desk */
    if (SPR.table1) blitSized("table1", teacherDesk.x, teacherDesk.y, teacherDesk.w, teacherDesk.h);
    else if (SPR.table0) blitSized("table0", teacherDesk.x, teacherDesk.y, teacherDesk.w, teacherDesk.h);
    if (SPR.monitor) blitSized("monitor", teacherDesk.x + 36, teacherDesk.y - 12, 26, 20);
  }

  function drawDesk(d) {
    /* chair behind (toward bottom / larger Y) */
    const chairName = d.chair;
    if (SPR[chairName]) blitSized(chairName, d.x + 20, d.y + 18, 22, 34);
    /* desk / table */
    const tname = SPR[d.table] ? d.table : (SPR.table0 ? "table0" : "k_table");
    if (SPR[tname]) blitSized(tname, d.x + 2, d.y + 2, d.w - 4, 28);
    /* monitor */
    if (SPR.monitor) blitSized("monitor", d.x + 22, d.y - 2, 22, 18);
    else if (SPR.office1) blitSized("office1", d.x + 20, d.y - 4, 26, 20);
  }

  function drawBackProps() {
    if (SPR.bookshelf) blitSized("bookshelf", 14, 395, 55, 55);
    else if (SPR.kshelf0) blitSized("kshelf0", 14, 400, 50, 48);
    if (SPR.printer) blitSized("printer", 280, 405, 55, 42);
    if (SPR.sofa1) blitSized("sofa1", 90, 410, 70, 32);
    if (SPR.vending) blitSized("vending", 240, 395, 32, 52);
  }

  function drawWorld() {
    drawFloor();
    drawFrontWallProps();

    /* subtle zone tints + labels */
    for (const z of zones) {
      ctx.fillStyle = z.color;
      ctx.fillRect(z.x, z.y, z.w, z.h);
      if (highlightZone === z.id || hoverZone === z) {
        ctx.fillStyle = C.highlight;
        ctx.fillRect(z.x, z.y, z.w, z.h);
      }
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.fillRect(z.x + 4, z.y + 4, 56, 13);
      ctx.fillStyle = C.zoneLabel;
      ctx.font = "bold 10px PingFang HK, Noto Sans TC, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(z.name, z.x + 7, z.y + 14);
    }

    /* desks under actors (actors drawn later with Y-sort) — chairs/tables only;
       students drawn in drawActors so they Y-sort with teacher */
    for (const d of desks) drawDesk(d);

    drawBackProps();
  }

  function drawActors() {
    const list = [];
    for (const s of students) list.push({ kind: "s", ref: s, y: s.y + s.h });
    list.push({ kind: "t", ref: teacher, y: teacher.y + teacher.h });
    list.push({ kind: "c", ref: cat, y: cat.y + cat.h });
    list.sort((a, b) => a.y - b.y);
    for (const item of list) {
      if (item.kind === "c") {
        const nm = cat.facing === 1 ? "cat_flip" : "cat";
        if (SPR[nm]) blitSized(nm, cat.x, cat.y + (cat.asleep ? 1 : 0), cat.w, cat.h);
        continue;
      }
      const bob = item.ref.seated ? Math.sin(frame * 0.05 + (item.ref.bob || 0)) * 0.4 : 0;
      drawChar(item.ref, bob);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function wrapText(text, x, y, maxW, lineH) {
    let line = "";
    for (const ch of text.split("")) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, y); line = ch; y += lineH; }
      else line = test;
    }
    if (line) ctx.fillText(line, x, y);
  }

  function drawUI() {
    ctx.fillStyle = C.uiPanel;
    ctx.fillRect(0, 0, W, TOP_H);
    ctx.fillStyle = C.uiAccent;
    ctx.fillRect(0, TOP_H, W, 2);
    ctx.fillStyle = C.ui;
    ctx.font = "bold 12px PingFang HK, Noto Sans TC, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("像素課室 · 中四 ICT", 10, 18);
    ctx.textAlign = "right";
    ctx.fillStyle = C.uiDim;
    ctx.fillText("4×4 · 16 位", W - 10, 18);

    ctx.fillStyle = C.uiPanel;
    ctx.fillRect(0, H - BAR_H, W, BAR_H);
    ctx.fillStyle = C.uiPanelBorder;
    ctx.fillRect(0, H - BAR_H, W, 2);
    ctx.fillStyle = C.uiDim;
    ctx.font = "11px PingFang HK, Noto Sans TC, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(
      isTouchUI ? "虛擬方向鍵移動老師 · 右下互動" : "WASD／方向鍵移動老師 · E 互動 · 1–2 區域",
      W / 2, H - BAR_H + 26
    );

    if (panel) {
      ctx.fillStyle = C.overlay; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = C.uiPanelMid; ctx.strokeStyle = C.uiPanelBorder; ctx.lineWidth = 3;
      roundRect(panel.x, panel.y, panel.pw, panel.ph, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.titleGold;
      ctx.font = "bold 16px PingFang HK, Noto Sans TC, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(panel.title, panel.x + 16, panel.y + 28);
      ctx.fillStyle = C.ui;
      ctx.font = "13px PingFang HK, Noto Sans TC, sans-serif";
      wrapText(panel.info, panel.x + 16, panel.y + 54, panel.pw - 32, 18);
      closeBtn = { x: panel.x + panel.pw - 44, y: panel.y + 10, w: 32, h: 28 };
      ctx.fillStyle = "#c87858"; ctx.fillRect(closeBtn.x, closeBtn.y, closeBtn.w, closeBtn.h);
      ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("✕", closeBtn.x + 16, closeBtn.y + 19);
    }
  }

  function drawTitle() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    /* preview classroom behind title */
    ctx.save();
    ctx.translate(0, 40);
    ctx.scale(1, 1);
    drawFloor();
    drawFrontWallProps();
    for (const d of desks) drawDesk(d);
    for (const s of students) drawChar(s, 0);
    drawChar(teacher, 0);
    ctx.restore();
    ctx.fillStyle = "rgba(10,14,22,0.62)";
    ctx.fillRect(0, 0, W, 130);
    ctx.fillRect(0, H - 150, W, 150);
    ctx.fillStyle = C.titleGold;
    ctx.font = "bold 28px PingFang HK, Noto Sans TC, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("像素課室", W / 2, 58);
    ctx.fillStyle = C.titleCream;
    ctx.font = "14px PingFang HK, Noto Sans TC, sans-serif";
    ctx.fillText("上課，像玩遊戲一樣", W / 2, 86);
    ctx.fillStyle = C.uiDim;
    ctx.font = "12px PingFang HK, Noto Sans TC, sans-serif";
    ctx.fillText("4×4 座位 · 16 同學 · 你係老師", W / 2, 110);
    startBtn = { x: W / 2 - 90, y: H - 100, w: 180, h: 52 };
    ctx.fillStyle = C.uiAccent;
    roundRect(startBtn.x, startBtn.y, startBtn.w, startBtn.h, 14); ctx.fill();
    ctx.fillStyle = "#1a2030";
    ctx.font = "bold 18px PingFang HK, Noto Sans TC, sans-serif";
    ctx.fillText("開始上課", W / 2, startBtn.y + 34);
  }

  function tick() {
    frame++;
    if (highlightTimer > 0) highlightTimer--;
    else if (!panel) highlightZone = -1;
    if (state === STATE.PLAY) {
      updateTeacher(); updateCat(); updateCamera();
    }
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    if (state === STATE.TITLE) drawTitle();
    else {
      ctx.save();
      ctx.translate((-cam.x + 0.5) | 0, (-cam.y + 0.5) | 0);
      drawWorld(); drawActors();
      ctx.restore();
      drawUI();
    }
    requestAnimationFrame(tick);
  }

  Promise.all([
    fetch("assets/atlas.json").then(r => r.json()),
    new Promise((resolve, reject) => { atlas.onload = resolve; atlas.onerror = reject; atlas.src = "assets/atlas.png"; })
  ]).then(([json]) => { SPR = json; atlasReady = true; tick(); })
    .catch((err) => {
      console.error(err);
      ctx.fillStyle = "#200"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff"; ctx.font = "14px monospace";
      ctx.fillText("Failed to load assets/", 20, 40);
    });
})();
</script>
</body>
</html>
